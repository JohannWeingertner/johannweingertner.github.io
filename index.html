    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { background: var(--bg); min-height: 100%; }
        body { color: var(--text); font-family: var(--font-sans, 'Inter', sans-serif); -webkit-font-smoothing: antialiased; font-feature-settings: 'cv11', 'ss01'; }
        .mono { font-family: var(--font-mono, 'DM Mono', monospace); }

        .skip-link {
            position: absolute;
            left: -9999px;
            top: 0;
            z-index: 100000;
            padding: 10px 14px;
            background: var(--surface3);
            color: var(--text);
            border: 1px solid var(--accent-border);
            border-radius: var(--radius-sm, 6px);
            font-size: 0.84rem;
            font-weight: 500;
            text-decoration: none;
        }
        .skip-link:focus {
            left: 16px;
            top: 16px;
        }

        :focus { outline: none; }
        :focus-visible {
            outline: var(--focus-ring, 2px solid var(--accent-text));
            outline-offset: var(--focus-offset, 2px);
        }

        /* Cards */
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; position: relative; overflow: hidden; transition: border-color 0.2s; }
        .card:hover { border-color: var(--border2); transform: none; box-shadow: none; }

        /* Nav */
        .nav-pill { border-radius: 0; padding: 5px 8px; font-size: 0.82rem; font-weight: 450; transition: color 0.15s; color: var(--muted); background: none; border: none; cursor: pointer; display: flex; align-items: center; gap: 5px; font-family: 'Inter', sans-serif; white-space: nowrap; }
        .nav-pill:hover { color: var(--text2); background: none; }
        .nav-pill.active { background: none; color: var(--text); border: none; }

        /* Tags - modern professional colors */
        .ptag { font-family: 'Inter', sans-serif; font-size: 0.67rem; padding: 2px 8px; border-radius: 5px; font-weight: 500; background: rgba(255,255,255,0.05); color: var(--text2); border: 1px solid rgba(255,255,255,0.08); }
        .ptag-primary { background: rgba(255,255,255,0.05); color: var(--text2); border: 1px solid rgba(255,255,255,0.08); }
        .ptag-cyan   { background: rgba(255,255,255,0.05); color: var(--text2); border: 1px solid rgba(255,255,255,0.08); }
        .ptag-emerald{ background: rgba(255,255,255,0.05); color: var(--text2); border: 1px solid rgba(255,255,255,0.08); }
        .ptag-amber  { background: rgba(255,255,255,0.05); color: var(--text2); border: 1px solid rgba(255,255,255,0.08); }
        .ptag-slate  { background: rgba(255,255,255,0.04); color: var(--muted); border: 1px solid rgba(255,255,255,0.07); }

        /* Skill pills */
        .skill-pill { background: rgba(255,255,255,0.04); border: 1px solid var(--border); color: var(--text2); font-size: 0.78rem; padding: 4px 12px; border-radius: 999px; transition: color 0.15s, border-color 0.15s; }
        .skill-pill:hover { border-color: var(--border2); color: var(--text); background: rgba(255,255,255,0.06); }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 4px; }

        /* Animations */
        @keyframes fadeUp   { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:translateY(0); } }
        @keyframes fadeIn   { from { opacity:0; } to { opacity:1; } }
        @keyframes typeBlink { 0%,100%{opacity:1;} 50%{opacity:0;} }
        @keyframes modalIn  { from{opacity:0;transform:scale(0.97) translateY(8px);} to{opacity:1;transform:scale(1) translateY(0);} }
        @keyframes slideDown { from{opacity:0;transform:translateY(-6px);} to{opacity:1;transform:translateY(0);} }
        @keyframes nameGlow { 0%,100%{text-shadow:none;} 50%{text-shadow:0 0 48px rgba(220,38,38,0.18);} }
        @keyframes rowSlide { from{opacity:0;transform:translateY(8px);} to{opacity:1;transform:translateY(0);} }
        @keyframes ctaPop   { 0%{opacity:0;transform:translateY(8px);} 100%{opacity:1;transform:translateY(0);} }
        @keyframes pageEnter { from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:translateY(0);} }
        @keyframes avatarIn { from{opacity:0;transform:scale(0.92);} to{opacity:1;transform:scale(1);} }
        @keyframes chipIn { from{opacity:0;transform:translateY(6px);} to{opacity:1;transform:translateY(0);} }

        .fade-up   { animation: fadeUp var(--dur-enter, 380ms) var(--ease-out-quint, cubic-bezier(0.22,1,0.36,1)) both; }
        .fade-up-1 { animation: fadeUp var(--dur-enter, 380ms) 0.07s var(--ease-out-quint, cubic-bezier(0.22,1,0.36,1)) both; }
        .fade-up-2 { animation: fadeUp var(--dur-enter, 380ms) 0.14s var(--ease-out-quint, cubic-bezier(0.22,1,0.36,1)) both; }
        .fade-up-3 { animation: fadeUp var(--dur-enter, 380ms) 0.21s var(--ease-out-quint, cubic-bezier(0.22,1,0.36,1)) both; }
        .page-enter { animation: pageEnter var(--dur-enter, 380ms) var(--ease-out-quint, cubic-bezier(0.22,1,0.36,1)) both; }
        .slide-down { animation: slideDown var(--dur-fast, 150ms) var(--ease-out-quint, cubic-bezier(0.22,1,0.36,1)) both; }
        .type-cursor { display:inline-block; width:2px; height:1em; background:var(--accent); margin-left:2px; vertical-align:text-bottom; animation:typeBlink 0.75s step-end infinite; }
        .flex-shrink-0 { flex-shrink: 0; }
        .modal-overlay { position:fixed; inset:0; background:radial-gradient(circle at 50% 32%, var(--overlay-glow), transparent 52%), var(--overlay-backdrop); z-index:10000; display:flex; align-items:center; justify-content:center; padding:1rem; animation:fadeIn var(--dur-med, 220ms) var(--ease-out-quint, cubic-bezier(0.22,1,0.36,1)) both; }
        .modal-box { background:var(--bg); border:none; border-radius:10px; max-width:520px; width:100%; max-height:85vh; overflow-y:auto; animation:modalIn 0.28s var(--ease-out-quint, cubic-bezier(0.22,1,0.36,1)) both; box-shadow:0 24px 60px rgba(0,0,0,0.65); }
        .modal-box::-webkit-scrollbar { width:3px; }
        .modal-box::-webkit-scrollbar-thumb { background:var(--accent-border); border-radius:2px; }
        .modal-close { color:var(--muted); background:transparent; border:1px solid transparent; border-radius:5px; cursor:pointer; padding:4px; transition:color var(--dur-fast, 150ms), border-color var(--dur-fast, 150ms), background var(--dur-fast, 150ms), transform var(--dur-fast, 150ms); }
        .modal-close:hover { color:var(--accent-text); border-color:var(--accent-border); background:var(--accent-soft); }
        .modal-close:active { transform: scale(0.94); }
        .modal-note { margin:0 0 14px; padding:11px 14px; background:var(--accent-soft); border:1px solid var(--accent-border); border-radius:6px; font-size:0.83rem; color:var(--text2); line-height:1.7; }
        .cert-modal-box { max-width:820px; }
        .credential-image { width:100%; max-height:620px; object-fit:contain; display:block; border-radius:6px; background:var(--surface); }

        /* Name heading glow */
        .hero-name { animation: nameGlow 5s ease-in-out infinite; }

        /* List row hover highlight */
        .list-row { position: relative; transition: background var(--dur-med, 220ms) var(--ease-out-quint, cubic-bezier(0.22,1,0.36,1)), transform var(--dur-med, 220ms) var(--ease-out-quint, cubic-bezier(0.22,1,0.36,1)); cursor: pointer; }
        .list-row::before { content:''; position:absolute; left:-12px; top:0; bottom:0; width:2px; background:var(--accent); border-radius:2px; opacity:0; transform: scaleY(0.4); transition: opacity var(--dur-med, 220ms) var(--ease-out-quint, cubic-bezier(0.22,1,0.36,1)), transform var(--dur-med, 220ms) var(--ease-out-quint, cubic-bezier(0.22,1,0.36,1)); }
        .list-row:hover { background: var(--accent-soft); transform: translateX(2px); }
        .list-row:hover::before { opacity: 1; transform: scaleY(1); }
        .list-row:active { transform: translateX(1px) scale(0.995); }
        .list-chevron { transition: transform var(--dur-med, 220ms) var(--ease-out-quint, cubic-bezier(0.22,1,0.36,1)), color var(--dur-med, 220ms); }
        .list-row:hover .list-chevron { transform: translateX(3px); color: var(--accent-text); }

        /* Row enter animation */
        .row-in { animation: rowSlide 0.36s var(--ease-out-quint, cubic-bezier(0.22,1,0.36,1)) both; }

        /* CTA buttons */
        .cta-btn { display:inline-flex; align-items:center; gap:8px; padding:9px 17px; border-radius:8px; font-size:0.85rem; font-weight:500; text-decoration:none; transition:color var(--dur-med, 220ms), background var(--dur-med, 220ms), transform var(--dur-fast, 150ms), border-color var(--dur-med, 220ms); border:1px solid transparent; color:var(--text2); background:transparent; cursor:pointer; font-family:'Inter',sans-serif; animation: ctaPop 0.4s var(--ease-out-quint, cubic-bezier(0.22,1,0.36,1)) both; }
        .cta-btn:hover { border-color:transparent; color:var(--accent-text); background:var(--accent-soft); transform:translateY(-1px); }
        .cta-btn:active { transform: translateY(0) scale(0.97); }
        .cta-btn.primary { background:var(--accent); color:#fafafa; border-color:transparent; }
        .cta-btn.primary:hover { background:#ef4444; transform:translateY(-1px); }

        /* Nav active underline — one sliding bar, not a pop per pill */
        .site-nav { position: sticky; top: 0; z-index: 50; background: var(--bg); border-bottom: 1px solid var(--border); }
        .nav-pill { position:relative; transition: color var(--dur-med, 220ms) var(--ease-out-quint, cubic-bezier(0.22,1,0.36,1)); }
        .nav-pill.active { color: var(--text); }
        .nav-indicator {
            position: absolute;
            bottom: -1px;
            left: 0;
            height: 1px;
            background: var(--accent);
            border-radius: 1px;
            pointer-events: none;
            width: 0;
            transform: translateX(0);
            transition: transform var(--dur-med, 220ms) var(--ease-out-quint, cubic-bezier(0.22,1,0.36,1)),
                        width var(--dur-med, 220ms) var(--ease-out-quint, cubic-bezier(0.22,1,0.36,1));
        }

        .writeup-fig {
            opacity: 0;
            transform: translateY(14px);
        }
        .writeup-fig.is-in {
            opacity: 1;
            transform: none;
            transition: opacity 420ms var(--ease-out-quint, cubic-bezier(0.22,1,0.36,1)),
                        transform 420ms var(--ease-out-quint, cubic-bezier(0.22,1,0.36,1));
        }

        .code-wrap { position: relative; margin: 0 0 14px; }
        .code-wrap pre { margin: 0; }
        .code-copy {
            position: absolute;
            top: 8px;
            right: 8px;
            font-size: 0.68rem;
            font-weight: 500;
            font-family: Inter, sans-serif;
            color: var(--muted);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 5px;
            padding: 3px 8px;
            cursor: pointer;
            transition: color var(--dur-fast, 150ms), border-color var(--dur-fast, 150ms), background var(--dur-fast, 150ms);
        }
        .code-copy:hover { color: var(--text); border-color: var(--border2); }
        .code-wrap.is-copied pre { box-shadow: inset 0 0 0 1px var(--accent-border); }

        /* Diff bar */
        .diff-bar-track { height:5px; background: var(--surface3); border-radius: 99px; overflow: hidden; }
        .diff-bar-fill { height:100%; border-radius: 99px; }

        /* Toggle */
        .toggle-wrap { display: inline-flex; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 3px; gap: 2px; flex-wrap: nowrap; white-space: nowrap; }
        .toggle-btn { padding: 6px 15px; border-radius: 4px; font-size: 0.84rem; font-weight: 500; color: var(--muted); transition: color 0.15s; display: inline-flex; align-items: center; gap: 6px; background: none; border: none; cursor: pointer; font-family: 'Inter', sans-serif; white-space: nowrap; }
        .toggle-btn.on { background: var(--surface3); color: var(--text); border: 1px solid var(--border); }

        /* Interactive 3D cube-grid background */
        #bg-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            width: 100dvw;
            height: 100dvh;
            z-index: 0;
            pointer-events: none;
        }
        #root { position: relative; z-index: 1; }

        .nav-inner {
            max-width: 720px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 50px;
            gap: 8px;
        }
        .nav-links {
            display: flex;
            gap: 0;
            flex-wrap: nowrap;
            justify-content: center;
            align-items: center;
        }
        @media (max-width: 860px) {
            .nav-inner {
                height: auto;
                min-height: 50px;
                flex-wrap: wrap;
                padding: 8px 16px;
                row-gap: 4px;
            }
            .nav-links { flex-wrap: wrap; justify-content: center; }
            .nav-pill { padding: 4px 6px; font-size: 0.76rem; }
        }
        /* Soft radial scrim — readable center, cubes visible at edges */
        .content-scrim {
            position: relative;
            isolation: isolate;
        }
        .content-scrim::before {
            content: '';
            position: absolute;
            inset: -48px -80px -96px;
            background: radial-gradient(ellipse 78% 65% at 50% 42%, var(--bg) 50%, transparent 100%);
            z-index: -1;
            pointer-events: none;
        }

        .hero-row {
            display: flex;
            align-items: center;
            gap: 22px;
            margin-bottom: 24px;
        }

        .profile-avatar {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            object-fit: cover;
            object-position: center 15%;
            border: none;
            box-shadow: none;
            flex-shrink: 0;
            margin-bottom: 0;
            display: block;
            animation: avatarIn 0.45s var(--ease-out-quint, cubic-bezier(0.22,1,0.36,1)) both;
        }

        .hero-bio {
            font-size: 0.9rem;
            line-height: 1.75;
            color: var(--text2);
            max-width: 520px;
            margin-bottom: 22px;
        }

        .stat-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 28px;
        }

        .stat-chip {
            font-size: 0.74rem;
            font-weight: 500;
            padding: 5px 13px;
            border-radius: 999px;
            border: 1px solid var(--border);
            color: var(--text2);
            background: rgba(255, 255, 255, 0.02);
            animation: chipIn 0.34s var(--ease-out-quint, cubic-bezier(0.22,1,0.36,1)) both;
        }

        .stat-chip.accent {
            border-color: var(--accent-border);
            color: var(--accent-text);
            background: var(--accent-soft);
        }

        /* Labs */
        .labs-toolbar {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 20px;
        }
        .labs-search {
            width: 100%;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            font-size: 0.84rem;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: border-color 0.15s;
        }
        .labs-search::placeholder { color: var(--muted); }
        .labs-search:focus { border-color: var(--accent-border); }
        .labs-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }
        .labs-sort {
            display: inline-flex;
            align-items: center;
            gap: 0;
            flex-wrap: wrap;
        }
        .labs-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .labs-empty {
            padding: 32px 0;
            text-align: center;
            font-size: 0.84rem;
            color: var(--muted);
        }

        @media (prefers-reduced-motion: reduce) {
            .fade-up, .fade-up-1, .fade-up-2, .fade-up-3, .page-enter, .row-in, .hero-name, .cta-btn, .profile-avatar, .stat-chip, .modal-overlay, .modal-box {
                animation: none !important;
            }
            .list-row, .list-row::before, .nav-pill, .nav-indicator, .cta-btn, .modal-close, .writeup-fig, .writeup-fig.is-in, .code-copy {
                transition: none !important;
            }
            .list-row:hover, .list-row:active, .cta-btn:hover, .cta-btn:active {
                transform: none !important;
            }
            .writeup-fig { opacity: 1; transform: none; }
            .type-cursor { animation: none; opacity: 1; }
        }
    </style>

<script>
(function () {
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true })
        || canvas.getContext('2d', { alpha: false });
    let w, h, dpr, time = 0, scale = 36, originX = 0, originY = 0;
    let COLS = 20, ROWS = 20;

    // ── Full-screen isometric red cube grid (dark theme) ─────
    // Smaller scale = farther camera. Count rises to still cover corners,
    // then clamps so a 4K screen cannot spawn thousands of cubes.
    const CELL = 1;
    const HALF = 0.36;
    const BASE_H = 0.16;
    const LIFT_MAX = 1.35;
    const TARGET_SCALE = 30;
    const HOVER_PX = 150;
    const HOVER_PX2 = HOVER_PX * HOVER_PX;
    const FRAME_MS = 1000 / 30;
    const IDLE_BREATH_MS = 1000 / 12;
    const IDLE_MS = 400;
    const COVER_PAD = 120;
    const AXIS_MIN = 22;
    const AXIS_MAX = 48;
    const AXIS_STATIC_MIN = 14;
    const AXIS_STATIC_MAX = 24;

    const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const saveData = !!(navigator.connection && navigator.connection.saveData);
    const coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
    const lowMem = typeof navigator.deviceMemory === 'number' && navigator.deviceMemory > 0 && navigator.deviceMemory <= 2;
    const lowCpu = typeof navigator.hardwareConcurrency === 'number' && navigator.hardwareConcurrency > 0 && navigator.hardwareConcurrency <= 2;
    const staticOnly = reduceMotion || saveData || lowMem || lowCpu
        || (coarse && Math.min(window.innerWidth, window.innerHeight) < 700);

    let cubes = [];
    let waves = [];
    let breathers = [];
    const mouse = { x: -9999, y: -9999, active: false };
    let running = false;
    let raf = 0;
    let lastFrame = 0;
    let idleTimer = 0;
    let contentRect = null;

    function viewportSize() {
        const vv = window.visualViewport;
        return {
            w: Math.max(window.innerWidth, vv ? Math.round(vv.width) : 0),
            h: Math.max(window.innerHeight, vv ? Math.round(vv.height) : 0),
        };
    }

    function seed() {
        cubes = [];
        const ox = (COLS - 1) * CELL * 0.5;
        const oz = (ROWS - 1) * CELL * 0.5;
        for (let j = 0; j < ROWS; j++) {
            for (let i = 0; i < COLS; i++) {
                const x = i * CELL - ox;
                const z = j * CELL - oz;
                cubes.push({
                    i, j, x, z,
                    h: BASE_H,
                    vh: 0,
                    phase: (i * 0.35 + j * 0.41),
                    sx: 0, sy: 0,
                    breathe: false,
                    depth: x + z,
                });
            }
        }
        cubes.sort((a, b) => a.depth - b.depth);
    }

    function project(x, y, z) {
        return {
            x: originX + (x - z) * scale * 0.866,
            y: originY + (x + z) * scale * 0.5 - y * scale,
        };
    }

    function face(pts) {
        ctx.beginPath();
        ctx.moveTo(pts[0].x, pts[0].y);
        ctx.lineTo(pts[1].x, pts[1].y);
        ctx.lineTo(pts[2].x, pts[2].y);
        ctx.lineTo(pts[3].x, pts[3].y);
        ctx.closePath();
    }

    function drawCube(cx, cz, height, brightness, stroke) {
        const top = height;
        const c1 = project(cx + HALF, 0,   cz - HALF);
        const c2 = project(cx + HALF, 0,   cz + HALF);
        const c3 = project(cx - HALF, 0,   cz + HALF);
        const t0 = project(cx - HALF, top, cz - HALF);
        const t1 = project(cx + HALF, top, cz - HALF);
        const t2 = project(cx + HALF, top, cz + HALF);
        const t3 = project(cx - HALF, top, cz + HALF);

        const b = brightness < 0 ? 0 : brightness > 1 ? 1 : brightness;
        if (stroke) {
            ctx.strokeStyle = `rgba(255, 100, 80, ${0.26 + b * 0.48})`;
            ctx.lineWidth = 0.6;
        }
        ctx.fillStyle = `rgba(130, 18, 18, ${0.07 + b * 0.18})`;
        face([c1, c2, t2, t1]);
        ctx.fill();
        if (stroke) ctx.stroke();
        ctx.fillStyle = `rgba(200, 32, 32, ${0.10 + b * 0.22})`;
        face([c3, c2, t2, t3]);
        ctx.fill();
        if (stroke) ctx.stroke();
        ctx.fillStyle = `rgba(255, 55, 55, ${0.14 + b * 0.28})`;
        face([t0, t1, t2, t3]);
        ctx.fill();
        if (stroke) ctx.stroke();
    }

    function refreshContentRect() {
        const main = document.getElementById('main');
        if (!main) {
            contentRect = null;
            return;
        }
        const r = main.getBoundingClientRect();
        if (r.width < 8 || r.height < 8) {
            contentRect = null;
            return;
        }
        contentRect = {
            l: r.left,
            r: r.right,
            t: r.top,
            b: r.bottom,
        };
    }

    function underContent(sx, sy) {
        const box = contentRect;
        return !!(box && sx > box.l && sx < box.r && sy > box.t && sy < box.b);
    }

    function spawnWave(clientX, clientY) {
        if (staticOnly) return;
        refreshContentRect();
        let best = null, bestD = Infinity;
        for (let k = 0; k < cubes.length; k++) {
            const c = cubes[k];
            if (underContent(c.sx, c.sy)) continue;
            const dx = c.sx - clientX, dy = c.sy - clientY;
            const d = dx * dx + dy * dy;
            if (d < bestD) { bestD = d; best = c; }
        }
        if (!best) return;
        waves.push({ x: best.x, z: best.z, r: 0, speed: 0.26, amp: 1.6, life: 1 });
        best.vh += 0.65;
        kick();
    }

    function poke(x, y) {
        mouse.x = x; mouse.y = y; mouse.active = true;
        kick();
    }

    function kick() {
        if (staticOnly) return;
        clearTimeout(idleTimer);
        idleTimer = setTimeout(() => { mouse.active = false; }, IDLE_MS);
        if (!running && document.visibilityState !== 'hidden') start();
    }

    function start() {
        if (running || staticOnly) return;
        running = true;
        lastFrame = 0;
        raf = requestAnimationFrame(step);
    }

    function stop() {
        running = false;
        if (raf) cancelAnimationFrame(raf);
        raf = 0;
    }

    window.addEventListener('mousemove', e => poke(e.clientX, e.clientY), { passive: true });
    window.addEventListener('mouseleave', () => { mouse.active = false; });
    window.addEventListener('touchmove', e => {
        if (e.touches[0]) poke(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });
    window.addEventListener('click', e => spawnWave(e.clientX, e.clientY));
    window.addEventListener('touchstart', e => {
        if (e.touches[0]) spawnWave(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });
    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden') stop();
        else if (!staticOnly) start();
    });

    // Tiny parallax: the painted field drifts a few pixels with scroll.
    // CSS transform only — no cube repaint. Clamped so long pages do not
    // walk the canvas off-screen.
    let scrollTick = 0;
    function applyParallax() {
        scrollTick = 0;
        if (staticOnly || reduceMotion) {
            canvas.style.transform = '';
            return;
        }
        const y = Math.max(-8, Math.min(8, -window.scrollY * 0.03));
        canvas.style.transform = y ? 'translate3d(0,' + y.toFixed(1) + 'px,0)' : '';
    }
    window.addEventListener('scroll', () => {
        if (scrollTick) return;
        scrollTick = requestAnimationFrame(applyParallax);
    }, { passive: true });

    function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, staticOnly ? 1 : 1.25);
        const vp = viewportSize();
        w = vp.w;
        h = vp.h;
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.imageSmoothingEnabled = false;

        originX = w * 0.5;
        originY = h * 0.52;
        const halfW = w * 0.5 + COVER_PAD;
        const halfH = Math.max(originY, h - originY) + COVER_PAD;
        const coverSpan = halfW / 0.866 + halfH / 0.5;

        const axisMin = staticOnly ? AXIS_STATIC_MIN : AXIS_MIN;
        const axisMax = staticOnly ? AXIS_STATIC_MAX : AXIS_MAX;
        const farScale = staticOnly ? TARGET_SCALE + 4 : TARGET_SCALE;
        const needed = Math.ceil(coverSpan / farScale) + 1;
        COLS = Math.max(axisMin, Math.min(axisMax, needed));
        ROWS = COLS;
        scale = Math.max(farScale, coverSpan / (COLS - 1));

        seed();
        pickBreathers();
        paint(true);
        applyParallax();
        if (!staticOnly) start();
    }

    function pickBreathers() {
        breathers = [];
        if (staticOnly) return;
        const edge = [];
        for (let k = 0; k < cubes.length; k++) {
            const c = cubes[k];
            c.breathe = false;
            const p = project(c.x, BASE_H, c.z);
            c.sx = p.x; c.sy = p.y;
            if (c.sx < 8 || c.sx > w - 8 || c.sy < 8 || c.sy > h - 8) continue;
            if (c.sx < 220 || c.sx > w - 220 || c.sy < 100 || c.sy > h - 120) edge.push(c);
        }
        const max = 10;
        const stride = Math.max(1, Math.ceil(edge.length / Math.max(max, 1)));
        for (let i = 0; i < edge.length && breathers.length < max; i += stride) {
            edge[i].breathe = true;
            breathers.push(edge[i]);
        }
    }

    function paint(forceStatic) {
        ctx.fillStyle = '#0a0a0a';
        ctx.fillRect(0, 0, w, h);

        const glow = ctx.createRadialGradient(originX, originY * 0.85, 0, originX, originY, Math.max(w, h) * 0.72);
        glow.addColorStop(0, 'rgba(160, 18, 18, 0.08)');
        glow.addColorStop(0.5, 'rgba(60, 8, 8, 0.04)');
        glow.addColorStop(1, 'rgba(10, 10, 10, 0)');
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, w, h);

        refreshContentRect();

        const animate = !forceStatic && !staticOnly;
        if (animate) {
            waves = waves.filter(wv => wv.life > 0.02 && wv.r < COLS);
            for (let wi = 0; wi < waves.length; wi++) {
                const wv = waves[wi];
                wv.r += wv.speed;
                wv.life *= 0.987;
                wv.amp *= 0.99;
            }
        }

        let anyMotion = waves.length > 0;

        for (let k = 0; k < cubes.length; k++) {
            const c = cubes[k];
            if (animate) {
                const hidden = underContent(c.sx, c.sy);
                const dx = c.sx - mouse.x, dy = c.sy - mouse.y;
                const nearMouse = !hidden && mouse.active && (dx * dx + dy * dy) < HOVER_PX2;
                const unsettled = Math.abs(c.h - BASE_H) > 0.003 || Math.abs(c.vh) > 0.003;
                let nearWave = false;
                if (waves.length) {
                    for (let wi = 0; wi < waves.length; wi++) {
                        const wv = waves[wi];
                        const ddx = c.x - wv.x, ddz = c.z - wv.z;
                        const d = Math.sqrt(ddx * ddx + ddz * ddz);
                        if (Math.abs(d - wv.r) < 1.6) { nearWave = true; break; }
                    }
                }
                if (nearMouse || nearWave || unsettled || c.breathe) {
                    anyMotion = true;
                    const breathe = nearMouse
                        ? Math.sin(time * 1.15 + c.phase) * 0.05
                        : (c.breathe ? Math.sin(time * 0.7 + c.phase) * 0.16 : 0);
                    let target = BASE_H + breathe;
                    if (nearMouse) {
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        const t = 1 - dist / HOVER_PX;
                        target += LIFT_MAX * t * t;
                    }
                    for (let wi = 0; wi < waves.length; wi++) {
                        const wv = waves[wi];
                        const ddx = c.x - wv.x, ddz = c.z - wv.z;
                        const d = Math.sqrt(ddx * ddx + ddz * ddz);
                        const band = Math.abs(d - wv.r);
                        if (band < 1.4) target += (1 - band / 1.4) * wv.amp * wv.life;
                    }
                    const force = (target - c.h) * 0.16;
                    c.vh = (c.vh + force) * 0.78;
                    c.h += c.vh;
                    if (c.h < 0.1) { c.h = 0.1; c.vh *= 0.5; }
                } else if (c.h !== BASE_H) {
                    c.h = BASE_H;
                    c.vh = 0;
                }
            }
            const p = project(c.x, c.h, c.z);
            c.sx = p.x; c.sy = p.y;
        }

        for (let k = 0; k < cubes.length; k++) {
            const c = cubes[k];
            if (c.sx < -80 || c.sx > w + 80 || c.sy < -80 || c.sy > h + 80) continue;
            const lift = Math.max(0, Math.min(1, (c.h - BASE_H) / LIFT_MAX));
            const brightness = 0.18 + lift * 0.55 + (animate && lift > 0.01 ? Math.sin(time * 1.1 + c.phase) * 0.03 : 0);
            drawCube(c.x, c.z, c.h, brightness, lift > 0.08);
        }

        return anyMotion;
    }

    function step(now) {
        if (!running) return;
        raf = requestAnimationFrame(step);
        const busy = mouse.active || waves.length > 0;
        const interval = busy ? FRAME_MS : IDLE_BREATH_MS;
        if (now - lastFrame < interval) return;
        const dt = Math.min(0.05, (now - lastFrame) / 1000);
        lastFrame = now;
        time += dt;
        if (!paint(false) && !breathers.length) stop();
    }

    let resizeTimer = 0;
    const onResize = () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(resize, 120);
    };
    window.addEventListener('resize', onResize);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', onResize);
    resize();
})();
</script>

const normalizePath = (pathname) => {
    const trimmed = (pathname || '/').replace(/\/+$/, '');
    return trimmed === '' ? '/' : trimmed;
};

const parsePath = (pathname) => {
    const path = normalizePath(pathname);
    if (path === '/') return emptyRoute();

    const writeupMatch = path.match(/^\/writeup\/writeup-(\d+)$/);
    if (writeupMatch) return { page: 'writeup-detail', writeupId: Number(writeupMatch[1]), certSlug: null };
    if (path === '/writeup') return { page: 'writeups', writeupId: null, certSlug: null };

    const certMatch = path.match(/^\/(?:certifications|certs)\/([a-z0-9-]+)$/);
    if (certMatch) return { page: 'cert-detail', writeupId: null, certSlug: certMatch[1] };
    if (path === '/certifications' || path === '/certs') return { page: 'certs', writeupId: null, certSlug: null };

    for (const [page, pagePath] of Object.entries(PAGE_PATHS)) {
        if (page !== 'home' && pagePath === path) return { page, writeupId: null, certSlug: null };
    }
    return emptyRoute();
};

        el.setAttribute(attr, key);
        document.head.appendChild(el);

};

const reduceMotionOn = () =>
    window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const RevealFigure = ({ src, caption, eager }) => {
    const ref = useRef(null);
    const [shown, setShown] = useState(() => !!(eager || reduceMotionOn()));
    useEffect(() => {
        if (shown) return;
        const node = ref.current;
        if (!node || !('IntersectionObserver' in window)) {
            setShown(true);
            return;
        }
        const io = new IntersectionObserver((entries) => {
            if (entries[0] && entries[0].isIntersecting) {
                setShown(true);
                io.disconnect();
            }
        }, { rootMargin: '0px 0px -8% 0px', threshold: 0.12 });
        io.observe(node);
        return () => io.disconnect();
    }, [shown]);
    return (
        <figure ref={ref} className={shown ? 'writeup-fig is-in' : 'writeup-fig'} style={{margin:'20px 0',padding:0}}>
            <img
                src={src}
                alt={caption || ''}
                loading={eager ? 'eager' : 'lazy'}
                decoding="async"
                fetchPriority={eager ? 'high' : 'low'}
                style={{width:'100%',borderRadius:6,border:'1px solid var(--border)',display:'block'}}
            />
            {caption && (
                <figcaption style={{fontSize:'0.75rem',color:'var(--muted)',textAlign:'center',marginTop:6,fontStyle:'italic'}}>
                    {caption}
                </figcaption>
            )}
        </figure>
    );
};

const CodeBlock = ({ text }) => {
    const [copied, setCopied] = useState(false);
    const copy = async () => {
        try {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                await navigator.clipboard.writeText(text);
            } else {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.setAttribute('readonly', '');
                ta.style.position = 'fixed';
                ta.style.left = '-9999px';
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
            }
            setCopied(true);
            window.setTimeout(() => setCopied(false), 1400);
        } catch (_) { /* ignore */ }
    };
    return (
        <div className={copied ? 'code-wrap is-copied' : 'code-wrap'}>
            <pre style={{padding:'11px 14px',paddingRight:72,background:'rgba(255,255,255,0.04)',border:'1px solid var(--border)',borderRadius:6,fontSize:'0.78rem',color:'var(--text2)',fontFamily:"'DM Mono',monospace",overflowX:'auto',lineHeight:1.7,whiteSpace:'pre-wrap',wordBreak:'break-all'}}>
                {text}
            </pre>
            <button type="button" className="code-copy" onClick={copy} aria-label={copied ? 'Copied' : 'Copy code'}>
                {copied ? 'Copied' : 'Copy'}
            </button>
        </div>
    );
};

const renderWriteupBlock = (block, i, figureIndex = -1) => {
    switch (block.type) {
        case 'h2': return (
            <p key={i} style={{fontSize:'0.7rem',fontWeight:600,color:'var(--muted)',letterSpacing:'0.09em',textTransform:'uppercase',marginTop:28,marginBottom:10}}>
                {block.text}
            </p>
        );
        case 'h3': return (
            <p key={i} style={{fontSize:'0.84rem',fontWeight:600,color:'var(--text)',marginTop:16,marginBottom:8}}>
                {block.text}
            </p>
        );
        case 'p': return (
            <p key={i} style={{fontSize:'0.87rem',lineHeight:1.8,color:'var(--text2)',marginBottom:10}}>
                {block.text}
            </p>
        );
        case 'ul': return (
            <ul key={i} style={{listStyle:'none',padding:0,margin:'0 0 12px',display:'flex',flexDirection:'column',gap:6}}>
                {block.items.map((item,j)=>(
                    <li key={j} style={{display:'flex',alignItems:'flex-start',gap:10,fontSize:'0.86rem',color:'var(--text2)'}}>
                        <span style={{color:'var(--muted)',flexShrink:0}}>—</span>{item}
                    </li>
                ))}
            </ul>
        );
        case 'ol': return (
            <ol key={i} style={{listStyle:'none',padding:0,margin:'0 0 12px',display:'flex',flexDirection:'column',gap:6,counterReset:'ol-counter'}}>
                {block.items.map((item,j)=>(
                    <li key={j} style={{display:'flex',alignItems:'flex-start',gap:10,fontSize:'0.86rem',color:'var(--text2)'}}>
                        <span style={{color:'var(--muted)',flexShrink:0,minWidth:16,fontVariantNumeric:'tabular-nums'}}>{j+1}.</span>{item}
                    </li>
                ))}
            </ol>
        );
        case 'code': return <CodeBlock key={i} text={block.text} />;
        case 'note': return (
            <div key={i} className="modal-note">
                <span style={{color:'var(--muted)',fontWeight:600,fontSize:'0.7rem',letterSpacing:'0.06em',textTransform:'uppercase',display:'block',marginBottom:4}}>Note</span>
                {block.text}
            </div>
        );
        case 'table': return (
            <div key={i} style={{margin:'0 0 16px',overflowX:'auto'}}>
                <table style={{width:'100%',borderCollapse:'collapse',fontSize:'0.82rem'}}>
                    <thead>
                        <tr style={{borderBottom:'1px solid var(--border2)'}}>
                            {block.headers.map((h,j)=>(
                                <th key={j} style={{textAlign:'left',padding:'7px 12px',color:'var(--muted)',fontWeight:600,fontSize:'0.7rem',letterSpacing:'0.07em',textTransform:'uppercase',whiteSpace:'nowrap'}}>
                                    {h}
                                </th>
                            ))}
                        </tr>
                    </thead>
                    <tbody>
                        {block.rows.map((row,j)=>(
                            <tr key={j} style={{borderBottom:'1px solid var(--border)'}}>
                                {row.map((cell,k)=>(
                                    <td key={k} style={{padding:'8px 12px',color:'var(--text2)',verticalAlign:'top',fontFamily:k===0?"'DM Mono',monospace":'inherit',fontSize:k===0?'0.78rem':'0.82rem'}}>
                                        {cell}
                                    </td>
                                ))}
                            </tr>
                        ))}
                    </tbody>
                </table>
            </div>
        );
        case 'figure': {
            const eager = figureIndex === 0;
            return <RevealFigure key={i} src={block.src} caption={block.caption} eager={eager} />;
        }
        default: return null;
    }
};

                    <div style={{textAlign:'left',flex:1,minWidth:0}}>
                        <p style={{fontSize:'0.9rem',fontWeight:500,color:'var(--text)',marginBottom:4}}>{w.title}</p>
                        <p style={{fontSize:'0.78rem',color:'var(--muted)'}}>{w.summary}</p>
                    </div>
                    <div style={{display:'flex',alignItems:'center',gap:10,flexShrink:0,marginLeft:16}}>
                        <span style={{fontSize:'0.72rem',color:'var(--muted)'}}>{w.date}</span>
                    </div>
                </button>
            ))}
        </div>
    </div>
);

// ── App ───────────────────────────────────────────────────────
const App = () => {
    const initialRoute = parsePath(window.location.pathname);
    const [page, setPage] = useState(initialRoute.page);
    const [writeupId, setWriteupId] = useState(initialRoute.writeupId);
    const [activeCertSlug, setActiveCertSlug] = useState(initialRoute.certSlug);

    const applyRoute = (route, { replace = false } = {}) => {
        const next = {
            page: route.page,
            writeupId: route.writeupId ?? null,
            certSlug: route.certSlug ?? null,
        };
        const nextPath = pathForRoute(next);
        const currentPath = normalizePath(window.location.pathname);
        if (nextPath !== currentPath || window.location.pathname !== nextPath) {
            if (replace) history.replaceState(next, '', nextPath);
            else history.pushState(next, '', nextPath);
        }
        setPage(next.page);
        setWriteupId(next.writeupId);
        setActiveCertSlug(next.certSlug);
    };

    const navigate = (nextPage) => applyRoute({ page: nextPage, writeupId: null, certSlug: null });
    const openWriteup = (id) => applyRoute({ page: 'writeup-detail', writeupId: id, certSlug: null });
    const openCert = (slug) => applyRoute({ page: 'cert-detail', writeupId: null, certSlug: slug });

    useEffect(() => {
        const onPop = () => {
            const route = parsePath(window.location.pathname);
            setPage(route.page);
            setWriteupId(route.writeupId);
            setActiveCertSlug(route.certSlug);
        };
        window.addEventListener('popstate', onPop);
        const normalized = pathForRoute(initialRoute);
        if (window.location.pathname !== normalized) {
            history.replaceState(initialRoute, '', normalized);
        }
        return () => window.removeEventListener('popstate', onPop);
    }, []);

    useEffect(() => {
        const writeups = window.WRITEUPS || [];
        const certs = window.CERTIFICATIONS || [];
        const path = pathForRoute({ page, writeupId, certSlug: activeCertSlug });
        if (page === 'writeup-detail') {
            const w = writeups.find(item => item.id === writeupId);
            if (w) {
                applyDocumentMeta({
                    title: `${w.title} · johann.`,
                    description: w.summary || DEFAULT_DESCRIPTION,
                    path,
                    image: firstWriteupImage(w),
                    type: 'article',
                });
            } else {
                applyDocumentMeta({
                    title: 'Writeup not found · johann.',
                    description: 'The requested investigation writeup could not be found.',
                    path,
                });
            }
            return;
        }
        if (page === 'cert-detail') {
            const c = certs.find(item => certSlug(item) === activeCertSlug);
            if (c) {
                applyDocumentMeta({
                    title: `${c.name} · johann.`,
                    description: c.description || `${c.name} — ${c.issuer} (${c.year}).`,
                    path,
                    image: absoluteUrl(c.badge || '/assets/profile-avatar.png'),
                });
            } else {
                applyDocumentMeta({
                    title: 'Certification not found · johann.',
                    description: 'The requested certification could not be found.',
                    path,
                });
            }
            return;
        }
        const labels = {
            home: 'johannweingertner.github.io',
            certs: 'Certifications · johann.',
            labs: 'Labs · johann.',
            projects: 'Projects · johann.',
            writeups: 'Writeups · johann.',
            competitions: 'CTFs · johann.',
            experience: 'Experience · johann.',
        };
        applyDocumentMeta({
            title: labels[page] || 'johannweingertner.github.io',
            description: PAGE_DESCRIPTIONS[page] || DEFAULT_DESCRIPTION,
            path,
        });
    }, [page, writeupId, activeCertSlug]);

    const writeup = writeupId != null
        ? (window.WRITEUPS || []).find(w => w.id === writeupId)
        : null;
    const cert = activeCertSlug
        ? (window.CERTIFICATIONS || []).find(c => certSlug(c) === activeCertSlug)
        : null;
    const navActive = page === 'writeup-detail' ? 'writeups' : page === 'cert-detail' ? 'certs' : page;
    const navRef = useRef(null);
    const [navBar, setNavBar] = useState({ x: 0, w: 0 });

    useLayoutEffect(() => {
        const bar = navRef.current;
        const el = bar && bar.querySelector('.nav-pill.active');
        if (!bar || !el) return;
        const place = () => {
            const br = bar.getBoundingClientRect();
            const r = el.getBoundingClientRect();
            setNavBar({
                x: Math.round(r.left - br.left + 10),
                w: Math.max(8, Math.round(r.width - 20)),
            });
        };
        place();
        window.addEventListener('resize', place);
        return () => window.removeEventListener('resize', place);
    }, [navActive]);

    const view = page === 'writeup-detail'
        ? (writeup
            ? <WriteupPage writeup={writeup} onBack={() => navigate('writeups')} />
            : <WriteupNotFound onBack={() => navigate('writeups')} />)
        : page === 'cert-detail'
        ? (cert
            ? <CertPage cert={cert} onBack={() => navigate('certs')} />
            : <CertNotFound onBack={() => navigate('certs')} />)
        : page === 'certs' ? <CertsPage onOpenCert={openCert}/>
        : page === 'labs' ? <LabsPage/>
        : page === 'projects' ? <ProjectsPage/>
        : page === 'writeups' ? <WriteupsPage onOpenWriteup={openWriteup}/>
        : page === 'competitions' ? <CompetitionsPage/>
        : page === 'experience' ? <ExperiencePage/>
        : <HomePage/>;

    return (
    <div style={{minHeight:'100vh'}}>
        <nav ref={navRef} className="site-nav">
            <div className="nav-inner">
                <div className="nav-links">
                    {NAV.map(item=>(
                        <button key={item.id} onClick={()=>navigate(item.id)} className={`nav-pill ${navActive===item.id?'active':''}`}>
                            {item.label}
                        </button>
                    ))}
                </div>
            </div>
            <span className="nav-indicator" style={{transform:`translateX(${navBar.x}px)`,width:navBar.w}} aria-hidden="true"/>
        </nav>
        <main id="main" key={`${page}-${writeupId ?? 'none'}-${activeCertSlug ?? 'none'}`} className="content-scrim page-enter" style={{maxWidth:720,margin:'0 auto',padding:'48px 24px 100px'}} tabIndex={-1}>
            {view}
        </main>
        <footer style={{borderTop:'1px solid var(--border)',padding:'20px 24px'}}>
            <div style={{maxWidth:720,margin:'0 auto',textAlign:'center',display:'flex',flexDirection:'column',gap:8,alignItems:'center'}}>
                <span style={{fontSize:'0.72rem',color:'var(--muted)'}}>© 2026 Johann Weingertner</span>
                <a href="/feed" style={{fontSize:'0.72rem',color:'var(--muted)',textDecoration:'none'}}>Writeups feed</a>
            </div>
        </footer>
    </div>
    );
};

ReactDOM.render(<App />, document.getElementById('root'));
</script>
<script defer src="/assets/app.js?v=20260828c"></script>
</body>
</html>
