<canvas id="bg-canvas"></canvas>
<div id="root"></div>
<script>
(function () {
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let w, h, dpr, time = 0, scale = 36, originX = 0, originY = 0;
    let COLS = 28, ROWS = 28;

    // ── Full-screen isometric red cube grid (dark theme) ─────
    // Oversized floor so the diamond covers the whole viewport.
    // Soft ambient cubes; hover/click still lift brightly.
    const CELL = 1;
    const HALF = 0.40;
    const BASE_H = 0.28;
    const LIFT_MAX = 1.9;
    const HOVER_PX = 150;

    let cubes = [];
    let waves = [];
    const mouse = { x: -9999, y: -9999, active: false };

    function seed() {
        cubes = [];
        const ox = (COLS - 1) * CELL * 0.5;
        const oz = (ROWS - 1) * CELL * 0.5;
        for (let j = 0; j < ROWS; j++) {
            for (let i = 0; i < COLS; i++) {
                cubes.push({
                    i, j,
                    x: i * CELL - ox,
                    z: j * CELL - oz,
                    h: BASE_H,
                    vh: 0,
                    phase: (i * 0.35 + j * 0.41),
                    sx: 0, sy: 0,
                    depth: 0,
                });
            }
        }
    }

    function project(x, y, z) {
        const sx = originX + (x - z) * scale * 0.866;
        const sy = originY + (x + z) * scale * 0.5 - y * scale;
        return { x: sx, y: sy, depth: x + z };
    }

    function drawCube(cx, cz, height, brightness) {
        const top = height;
        const c1 = project(cx + HALF, 0,   cz - HALF);
        const c2 = project(cx + HALF, 0,   cz + HALF);
        const c3 = project(cx - HALF, 0,   cz + HALF);
        const t0 = project(cx - HALF, top, cz - HALF);
        const t1 = project(cx + HALF, top, cz - HALF);
        const t2 = project(cx + HALF, top, cz + HALF);
        const t3 = project(cx - HALF, top, cz + HALF);

        const b = Math.max(0, Math.min(1, brightness));
        const topA = 0.22 + b * 0.44;
        const leftA = 0.15 + b * 0.34;
        const rightA = 0.11 + b * 0.28;
        const topFill   = `rgba(255, 55, 55, ${topA})`;
        const leftFill  = `rgba(200, 32, 32, ${leftA})`;
        const rightFill = `rgba(130, 18, 18, ${rightA})`;
        const edge      = `rgba(255, 100, 80, ${0.26 + b * 0.48})`;

        function face(pts, fill) {
            ctx.beginPath();
            ctx.moveTo(pts[0].x, pts[0].y);
            for (let k = 1; k < pts.length; k++) ctx.lineTo(pts[k].x, pts[k].y);
            ctx.closePath();
            ctx.fillStyle = fill;
            ctx.fill();
            ctx.strokeStyle = edge;
            ctx.lineWidth = 0.6;
            ctx.stroke();
        }

        face([c3, c2, t2, t3], leftFill);
        face([c1, c2, t2, t1], rightFill);
        face([t0, t1, t2, t3], topFill);
    }

    function spawnWave(clientX, clientY) {
        let best = null, bestD = Infinity;
        for (let k = 0; k < cubes.length; k++) {
            const c = cubes[k];
            const dx = c.sx - clientX, dy = c.sy - clientY;
            const d = dx * dx + dy * dy;
            if (d < bestD) { bestD = d; best = c; }
        }
        if (!best) return;
        waves.push({ x: best.x, z: best.z, r: 0, speed: 0.26, amp: 1.6, life: 1 });
        best.vh += 0.65;
    }

    window.addEventListener('mousemove', e => {
        mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true;
    });
    window.addEventListener('mouseleave', () => { mouse.active = false; });
    window.addEventListener('touchmove', e => {
        if (e.touches[0]) {
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
            mouse.active = true;
        }
    }, { passive: true });
    window.addEventListener('click', e => spawnWave(e.clientX, e.clientY));
    window.addEventListener('touchstart', e => {
        if (e.touches[0]) spawnWave(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });

    function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        w = window.innerWidth;
        h = window.innerHeight;
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        // Cube size that tiles nicely; expand grid until the diamond covers
        // the full rectangle (diamond ≠ AABB — need larger than half-extents).
        scale = Math.max(18, Math.min(w, h) / 26);
        originX = w * 0.5;
        originY = h * 0.45;
        const halfW = w * 0.5 + 100;
        const halfH = Math.max(originY, h - originY) + 100;
        // Inside-diamond test: |dx|/A + |dy|/B <= 1 with A=N*s*0.866, B=N*s*0.5
        const nFromDiamond = Math.ceil(halfW / (scale * 0.866) + halfH / (scale * 0.5));
        COLS = Math.min(56, Math.max(30, nFromDiamond));
        ROWS = COLS;
        seed();
    }

    function step() {
        time += 0.016;
        ctx.clearRect(0, 0, w, h);

        const glow = ctx.createRadialGradient(originX, originY * 0.85, 0, originX, originY, Math.max(w, h) * 0.72);
        glow.addColorStop(0, 'rgba(160, 18, 18, 0.08)');
        glow.addColorStop(0.5, 'rgba(60, 8, 8, 0.04)');
        glow.addColorStop(1, 'rgba(10, 10, 10, 0)');
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, w, h);

        waves = waves.filter(wv => wv.life > 0.02 && wv.r < COLS);
        waves.forEach(wv => {
            wv.r += wv.speed;
            wv.life *= 0.987;
            wv.amp *= 0.99;
        });

        for (let k = 0; k < cubes.length; k++) {
            const c = cubes[k];
            const breathe = Math.sin(time * 1.15 + c.phase) * 0.05;
            let target = BASE_H + breathe;

            if (mouse.active) {
                const dx = c.sx - mouse.x, dy = c.sy - mouse.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < HOVER_PX) {
                    const t = 1 - dist / HOVER_PX;
                    target += LIFT_MAX * t * t;
                }
            }

            for (let wi = 0; wi < waves.length; wi++) {
                const wv = waves[wi];
                const dx = c.x - wv.x, dz = c.z - wv.z;
                const d = Math.sqrt(dx * dx + dz * dz);
                const band = Math.abs(d - wv.r);
                if (band < 1.4) target += (1 - band / 1.4) * wv.amp * wv.life;
            }

            const force = (target - c.h) * 0.16;
            c.vh = (c.vh + force) * 0.78;
            c.h += c.vh;
            if (c.h < 0.1) { c.h = 0.1; c.vh *= 0.5; }
        }

        const sorted = cubes.slice();
        for (let k = 0; k < sorted.length; k++) {
            const c = sorted[k];
            const p = project(c.x, c.h, c.z);
            c.sx = p.x; c.sy = p.y; c.depth = p.depth;
        }
        sorted.sort((a, b) => a.depth - b.depth);

        for (let k = 0; k < sorted.length; k++) {
            const c = sorted[k];
            // Skip off-screen cubes for perf
            if (c.sx < -80 || c.sx > w + 80 || c.sy < -80 || c.sy > h + 80) continue;
            const lift = Math.max(0, Math.min(1, (c.h - BASE_H) / LIFT_MAX));
            const brightness = 0.28 + lift * 0.62 + Math.sin(time * 1.1 + c.phase) * 0.03;
            drawCube(c.x, c.z, c.h, brightness);
        }

        if (!reduceMotion) requestAnimationFrame(step);
    }

    const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    window.addEventListener('resize', resize);
    resize();
    step();
})();
</script>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const Icon = ({ name, className = '', size = 15, ...props }) => {
    const ref = useRef(null);
    useEffect(() => {
        if (ref.current && lucide[name]) {
            const el = lucide.createElement(lucide[name], { width: size, height: size, 'stroke-width': 1.75 });
            ref.current.innerHTML = ''; ref.current.appendChild(el);
        }
    }, [name, size]);
    return <i ref={ref} className={`flex-shrink-0 ${className}`} style={{display:'inline-flex',alignItems:'center',justifyContent:'center',width:size,height:size}} {...props} />;
};

const useTyping = (text, speed = 42, delay = 800) => {
    const [displayed, setDisplayed] = useState('');
    const [done, setDone] = useState(false);
    useEffect(() => {
        setDisplayed(''); setDone(false); let i = 0;
        const t = setTimeout(() => {
            const iv = setInterval(() => { i++; setDisplayed(text.slice(0,i)); if(i>=text.length){clearInterval(iv);setDone(true);} }, speed);
            return () => clearInterval(iv);
        }, delay);
        return () => clearTimeout(t);
    }, [text]);
    return { displayed, done };
};

const ProjectsPage = () => {
    const [sortBy, setSortBy] = useState('date');
    const [category, setCategory] = useState('All');
    const [query, setQuery] = useState('');
    const allLabs = window.CD_LABS || [];
    const total = allLabs.length;

    const counts = React.useMemo(() => allLabs.reduce((a,l)=>{a[l.difficulty]=(a[l.difficulty]||0)+1;return a;},{}), [allLabs]);
    const catCounts = React.useMemo(() => allLabs.reduce((a,l)=>{a[l.category]=(a[l.category]||0)+1;return a;},{}), [allLabs]);

    const filteredLabs = React.useMemo(() => {
        let list = [...allLabs];
        if (category !== 'All') list = list.filter(l => l.category === category);
        if (query.trim()) {
            const q = query.trim().toLowerCase();
            list = list.filter(l => l.name.toLowerCase().includes(q) || l.category.toLowerCase().includes(q));
        }
        if (sortBy === 'date') return list.sort((a,b)=>{ if(!a.completed)return 1; if(!b.completed)return -1; return new Date(b.completed)-new Date(a.completed); });
        if (sortBy === 'name') return list.sort((a,b)=>a.name.localeCompare(b.name));
        const ord = {Easy:0,Medium:1,Hard:2,Extreme:3};
        return list.sort((a,b)=>(ord[a.difficulty]??4)-(ord[b.difficulty]??4)||a.name.localeCompare(b.name));
    }, [allLabs, sortBy, category, query]);

    return (
    <div>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:18,flexWrap:'wrap',gap:8}}>
            <p style={{...ST,marginBottom:0}}>CyberDefenders Labs</p>
            <a href="https://cyberdefenders.org/p/Afterguard/" target="_blank" rel="noopener noreferrer"
               className="cta-btn" style={{fontSize:'0.78rem',padding:'7px 14px',animation:'none'}}>
                <Icon name="Shield" size={13}/> Profile
            </a>
        </div>
        <p style={{fontSize:'0.78rem',color:'var(--muted)',marginBottom:18}}>
            CyberDefenders CyberRange Top 100 · {total} labs completed · 250+ hours · Easy {counts.Easy||0} · Medium {counts.Medium||0} · Hard {counts.Hard||0}
            {category !== 'All' || query ? ` · ${filteredLabs.length} shown` : ''}
        </p>

        <div className="labs-toolbar">
            <input
                className="labs-search"
                type="search"
                placeholder="Search labs..."
                value={query}
                onChange={e=>setQuery(e.target.value)}
            />
            <div className="labs-filters">
                {LAB_CATEGORIES.map(cat=>(
                    <button key={cat} onClick={()=>setCategory(cat)} className={`nav-pill${category===cat?' active':''}`}>
                        {cat === 'All' ? `All (${total})` : `${shortCategory(cat)} (${catCounts[cat]||0})`}
                    </button>
                ))}
            </div>
            <div className="labs-controls">
                <div className="labs-sort">
                    <span style={{fontSize:'0.72rem',color:'var(--muted)',marginRight:8,textTransform:'uppercase',letterSpacing:'0.06em'}}>Sort</span>
                    {[{id:'date',label:'Recent'},{id:'difficulty',label:'Difficulty'},{id:'name',label:'A–Z'}].map(t=>(
                        <button key={t.id} onClick={()=>setSortBy(t.id)} className={`nav-pill${sortBy===t.id?' active':''}`}>{t.label}</button>
                    ))}
                </div>
            </div>
        </div>

        <div style={ROW}>
            {filteredLabs.length === 0 ? (
                <p className="labs-empty">No labs match your filters.</p>
            ) : filteredLabs.map((lab,i)=>(
                <a key={`${lab.name}-${i}`} href={lab.url} target="_blank" rel="noopener noreferrer"
                   className="list-row"
                   style={{display:'flex',alignItems:'center',padding:'11px 0',borderBottom:'1px solid var(--border)',textDecoration:'none',gap:12}}>
                    <span style={{fontSize:'0.86rem',color:'var(--text)',flex:1,minWidth:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{lab.name}</span>
                    <div style={{display:'flex',alignItems:'center',gap:10,flexShrink:0}}>
                        <span style={{fontSize:'0.72rem',color:'var(--muted)'}}>{shortCategory(lab.category)}</span>
                        {lab.difficulty && <span style={{fontSize:'0.72rem',color:DIFF_HEX[lab.difficulty]||'var(--muted)'}}>{lab.difficulty}</span>}
                        {lab.completed && <span className="mono" style={{fontSize:'0.72rem',color:'var(--muted)'}}>{formatLabDate(lab.completed)}</span>}
                    </div>
                </a>
            ))}
        </div>
    </div>
    );
};

const WriteupModal = ({ writeup, onClose }) => {
    useEffect(() => {
        const h = (e) => { if (e.key === 'Escape') onClose(); };
        document.addEventListener('keydown', h);
        document.body.style.overflow = 'hidden';
        return () => { document.removeEventListener('keydown', h); document.body.style.overflow = ''; };
    }, [onClose]);

    const renderBlock = (block, i) => {
        switch (block.type) {
            case 'h2': return (
                <p key={i} style={{fontSize:'0.7rem',fontWeight:600,color:'var(--muted)',letterSpacing:'0.09em',textTransform:'uppercase',marginTop:28,marginBottom:10}}>
                    {block.text}
                </p>
            );
            case 'h3': return (
                <p key={i} style={{fontSize:'0.84rem',fontWeight:600,color:'var(--text)',marginTop:16,marginBottom:8}}>
                    {block.text}
                </p>
            );
            case 'p': return (
                <p key={i} style={{fontSize:'0.87rem',lineHeight:1.8,color:'var(--text2)',marginBottom:10}}>
                    {block.text}
                </p>
            );
            case 'ul': return (
                <ul key={i} style={{listStyle:'none',padding:0,margin:'0 0 12px',display:'flex',flexDirection:'column',gap:6}}>
                    {block.items.map((item,j)=>(
                        <li key={j} style={{display:'flex',alignItems:'flex-start',gap:10,fontSize:'0.86rem',color:'var(--text2)'}}>
                            <span style={{color:'var(--muted)',flexShrink:0}}>—</span>{item}
                        </li>
                    ))}
                </ul>
            );
            case 'ol': return (
                <ol key={i} style={{listStyle:'none',padding:0,margin:'0 0 12px',display:'flex',flexDirection:'column',gap:6,counterReset:'ol-counter'}}>
                    {block.items.map((item,j)=>(
                        <li key={j} style={{display:'flex',alignItems:'flex-start',gap:10,fontSize:'0.86rem',color:'var(--text2)'}}>
                            <span style={{color:'var(--muted)',flexShrink:0,minWidth:16,fontVariantNumeric:'tabular-nums'}}>{j+1}.</span>{item}
                        </li>
                    ))}
                </ol>
            );
            case 'code': return (
                <pre key={i} style={{margin:'0 0 14px',padding:'11px 14px',background:'rgba(255,255,255,0.04)',border:'1px solid var(--border)',borderRadius:6,fontSize:'0.78rem',color:'var(--text2)',fontFamily:"'DM Mono',monospace",overflowX:'auto',lineHeight:1.7,whiteSpace:'pre-wrap',wordBreak:'break-all'}}>
                    {block.text}
                </pre>
            );
            case 'note': return (
                <div key={i} className="modal-note">
                    <span style={{color:'var(--muted)',fontWeight:600,fontSize:'0.7rem',letterSpacing:'0.06em',textTransform:'uppercase',display:'block',marginBottom:4}}>Note</span>
                    {block.text}
                </div>
            );
            case 'table': return (
                <div key={i} style={{margin:'0 0 16px',overflowX:'auto'}}>
                    <table style={{width:'100%',borderCollapse:'collapse',fontSize:'0.82rem'}}>
                        <thead>
                            <tr style={{borderBottom:'1px solid var(--border2)'}}>
                                {block.headers.map((h,j)=>(
                                    <th key={j} style={{textAlign:'left',padding:'7px 12px',color:'var(--muted)',fontWeight:600,fontSize:'0.7rem',letterSpacing:'0.07em',textTransform:'uppercase',whiteSpace:'nowrap'}}>
                                        {h}
                                    </th>
                                ))}
                            </tr>
                        </thead>
                        <tbody>
                            {block.rows.map((row,j)=>(
                                <tr key={j} style={{borderBottom:'1px solid var(--border)'}}>
                                    {row.map((cell,k)=>(
                                        <td key={k} style={{padding:'8px 12px',color:'var(--text2)',verticalAlign:'top',fontFamily:k===0?"'DM Mono',monospace":'inherit',fontSize:k===0?'0.78rem':'0.82rem'}}>
                                            {cell}
                                        </td>
                                    ))}
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
            );
            case 'figure': return (
                <figure key={i} style={{margin:'20px 0',padding:0}}>
                    <img src={block.src} alt={block.caption||''} style={{width:'100%',borderRadius:6,border:'1px solid var(--border)',display:'block'}}/>
                    {block.caption && (
                        <figcaption style={{fontSize:'0.75rem',color:'var(--muted)',textAlign:'center',marginTop:6,fontStyle:'italic'}}>
                            {block.caption}
                        </figcaption>
                    )}
                </figure>
            );
            default: return null;
        }
    };

    return (
        <div className="modal-overlay" onClick={onClose}>
            <div className="modal-box" onClick={e=>e.stopPropagation()} style={{maxWidth:600}}>
                <div style={{padding:'22px 22px 18px',borderBottom:'1px solid var(--border)',position:'sticky',top:0,background:'var(--surface)',zIndex:1}}>
                    <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:12}}>
                        <div>
                            <p style={{fontSize:'0.96rem',fontWeight:600,color:'var(--text)',lineHeight:1.3,marginBottom:6}}>{writeup.title}</p>
                            <div style={{display:'flex',gap:12,alignItems:'center'}}>
                                <span style={{fontSize:'0.72rem',color:'var(--muted)'}}>{writeup.category}</span>
                                <span style={{fontSize:'0.72rem',color:DIFF_HEX[writeup.difficulty]||'var(--muted)'}}>{writeup.difficulty}</span>
                                <span style={{fontSize:'0.72rem',color:'var(--muted)'}}>{writeup.date}</span>
                            </div>
                        </div>
                        <button className="modal-close" onClick={onClose} style={{flexShrink:0}}>
                            <Icon name="X" size={14}/>
                        </button>
                    </div>
                </div>
                <div style={{padding:'4px 22px 28px'}}>
                    {writeup.content.map(renderBlock)}
                </div>
            </div>
        </div>
    );
};

                        <span style={{fontSize:'0.72rem',color:'var(--muted)'}}>{w.category}</span>
                        <span style={{fontSize:'0.72rem',color:DIFF_HEX[w.difficulty]||'var(--muted)'}}>{w.difficulty}</span>
                        <span style={{fontSize:'0.72rem',color:'var(--muted)'}}>{w.date}</span>
                    </div>
                </button>
            ))}
        </div>
        {sel && <WriteupModal writeup={sel} onClose={()=>setSel(null)}/>}
    </div>
    );
};

// ── App ───────────────────────────────────────────────────────
const App = () => {
    const [page, setPage] = useState('home');
    const pages = {
        home:<HomePage/>,
        certs:<CertsPage/>,
        projects:<ProjectsPage/>,
        writeups:<WriteupsPage/>,
        competitions:<CompetitionsPage/>,
        experience:<ExperiencePage/>,
    };
    return (
    <div style={{minHeight:'100vh'}}>
        <nav style={{position:'sticky',top:0,zIndex:50,background:'var(--bg)',borderBottom:'1px solid var(--border)'}}>
            <div style={{maxWidth:720,margin:'0 auto',padding:'0 24px',display:'flex',alignItems:'center',justifyContent:'space-between',height:50,gap:8}}>
                <button onClick={()=>setPage('home')} style={{background:'none',border:'none',cursor:'pointer',fontSize:'0.9rem',fontWeight:600,color:'var(--text)',letterSpacing:'-0.01em'}}>
                    johann.
                </button>
                <div style={{display:'flex',gap:0,flexWrap:'nowrap',justifyContent:'flex-end',alignItems:'center'}}>
                    {NAV.map(item=>(
                        <button key={item.id} onClick={()=>setPage(item.id)} className={`nav-pill ${page===item.id?'active':''}`}>
                            {item.label}
                        </button>
                    ))}
                </div>
            </div>
        </nav>
        <main className="content-scrim" style={{maxWidth:720,margin:'0 auto',padding:'48px 24px 100px'}}>
            {pages[page]}
        </main>
        <footer style={{borderTop:'1px solid var(--border)',padding:'20px 24px'}}>
            <div style={{maxWidth:720,margin:'0 auto',textAlign:'center'}}>
                <span style={{fontSize:'0.72rem',color:'var(--muted)'}}>© 2026 Johann Weingertner</span>
            </div>
        </footer>
    </div>
    );
};

ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
