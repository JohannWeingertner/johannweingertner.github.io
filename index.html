<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>johannweingertner.github.io</title>
    <link rel="icon" type="image/png" href="/assets/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://unpkg.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
    <link rel="preload" as="image" href="/assets/profile-avatar.png">
    <style>
        :root {
            --bg:        #0a0a0a;
            --surface:   #111111;
            --surface2:  #161616;
            --surface3:  #1c1c1c;
            --primary:   #d4d4d4;
            --primary-light: #e5e5e5;
            --primary-dim: #404040;
            --accent:    #dc2626;
            --accent-soft: rgba(220, 38, 38, 0.10);
            --accent-border: rgba(220, 38, 38, 0.32);
            --accent-text: #fca5a5;
            --accent-cyan:    #a3a3a3;
            --accent-emerald: #a3a3a3;
            --accent-amber:   #a3a3a3;
            --accent-slate:   #737373;
            --text:      #e5e5e5;
            --text2:     #a3a3a3;
            --muted:     #525252;
            --border:    rgba(255,255,255,0.05);
            --border2:   rgba(255,255,255,0.09);
            --overlay-backdrop: rgba(10, 10, 10, 0.94);
            --overlay-glow: rgba(220, 38, 38, 0.05);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; font-feature-settings: 'cv11', 'ss01'; }
        .mono { font-family: 'DM Mono', monospace; }

        /* Cards */
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; position: relative; overflow: hidden; transition: border-color 0.2s; }
        .card:hover { border-color: var(--border2); transform: none; box-shadow: none; }

        /* Nav */
        .nav-pill { border-radius: 0; padding: 5px 8px; font-size: 0.82rem; font-weight: 450; transition: color 0.15s; color: var(--muted); background: none; border: none; cursor: pointer; display: flex; align-items: center; gap: 5px; font-family: 'Inter', sans-serif; white-space: nowrap; }
        .nav-pill:hover { color: var(--text2); background: none; }
        .nav-pill.active { background: none; color: var(--text); border: none; }

        /* Tags - modern professional colors */
        .ptag { font-family: 'Inter', sans-serif; font-size: 0.67rem; padding: 2px 8px; border-radius: 5px; font-weight: 500; background: rgba(255,255,255,0.05); color: var(--text2); border: 1px solid rgba(255,255,255,0.08); }
        .ptag-primary { background: rgba(255,255,255,0.05); color: var(--text2); border: 1px solid rgba(255,255,255,0.08); }
        .ptag-cyan   { background: rgba(255,255,255,0.05); color: var(--text2); border: 1px solid rgba(255,255,255,0.08); }
        .ptag-emerald{ background: rgba(255,255,255,0.05); color: var(--text2); border: 1px solid rgba(255,255,255,0.08); }
        .ptag-amber  { background: rgba(255,255,255,0.05); color: var(--text2); border: 1px solid rgba(255,255,255,0.08); }
        .ptag-slate  { background: rgba(255,255,255,0.04); color: var(--muted); border: 1px solid rgba(255,255,255,0.07); }

        /* Skill pills */
        .skill-pill { background: rgba(255,255,255,0.04); border: 1px solid var(--border); color: var(--text2); font-size: 0.78rem; padding: 4px 12px; border-radius: 999px; transition: color 0.15s, border-color 0.15s; }
        .skill-pill:hover { border-color: var(--border2); color: var(--text); background: rgba(255,255,255,0.06); }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 4px; }

        /* Animations */
        @keyframes fadeUp   { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:translateY(0); } }
        @keyframes fadeIn   { from { opacity:0; } to { opacity:1; } }
        @keyframes typeBlink { 0%,100%{opacity:1;} 50%{opacity:0;} }
        @keyframes modalIn  { from{opacity:0;transform:scale(0.93) translateY(10px);} to{opacity:1;transform:scale(1) translateY(0);} }
        @keyframes slideDown { from{opacity:0;transform:translateY(-6px);} to{opacity:1;transform:translateY(0);} }
        @keyframes nameGlow { 0%,100%{text-shadow:none;} 50%{text-shadow:0 0 48px rgba(220,38,38,0.18);} }
        @keyframes rowSlide { from{opacity:0;transform:translateX(-10px);} to{opacity:1;transform:translateX(0);} }
        @keyframes ctaPop   { 0%{opacity:0;transform:scale(0.9) translateY(6px);} 100%{opacity:1;transform:scale(1) translateY(0);} }

        .fade-up   { animation: fadeUp 0.5s cubic-bezier(0.22,1,0.36,1) both; }
        .fade-up-1 { animation: fadeUp 0.5s 0.08s cubic-bezier(0.22,1,0.36,1) both; }
        .fade-up-2 { animation: fadeUp 0.5s 0.16s cubic-bezier(0.22,1,0.36,1) both; }
        .fade-up-3 { animation: fadeUp 0.5s 0.24s cubic-bezier(0.22,1,0.36,1) both; }
        .slide-down { animation: slideDown 0.15s ease both; }
        .type-cursor { display:inline-block; width:2px; height:1em; background:var(--accent); margin-left:2px; vertical-align:text-bottom; animation:typeBlink 0.75s step-end infinite; }
        .flex-shrink-0 { flex-shrink: 0; }
        .modal-overlay { position:fixed; inset:0; background:radial-gradient(circle at 50% 32%, var(--overlay-glow), transparent 52%), var(--overlay-backdrop); z-index:10000; display:flex; align-items:center; justify-content:center; padding:1rem; animation:fadeIn 0.18s ease both; }
        .modal-box { background:var(--bg); border:none; border-radius:10px; max-width:520px; width:100%; max-height:85vh; overflow-y:auto; animation:modalIn 0.25s cubic-bezier(0.34,1.2,0.64,1) both; box-shadow:0 24px 60px rgba(0,0,0,0.65); }
        .modal-box::-webkit-scrollbar { width:3px; }
        .modal-box::-webkit-scrollbar-thumb { background:var(--accent-border); border-radius:2px; }
        .modal-close { color:var(--muted); background:transparent; border:1px solid transparent; border-radius:5px; cursor:pointer; padding:4px; transition:color 0.15s, border-color 0.15s, background 0.15s; }
        .modal-close:hover { color:var(--accent-text); border-color:var(--accent-border); background:var(--accent-soft); }
        .modal-note { margin:0 0 14px; padding:11px 14px; background:var(--accent-soft); border:1px solid var(--accent-border); border-radius:6px; font-size:0.83rem; color:var(--text2); line-height:1.7; }
        .cert-modal-box { max-width:820px; }
        .credential-image { width:100%; max-height:620px; object-fit:contain; display:block; border-radius:6px; background:var(--surface); }

        /* Name heading glow */
        .hero-name { animation: nameGlow 5s ease-in-out infinite; }

        /* List row hover highlight */
        .list-row { position: relative; transition: background 0.15s; cursor: pointer; }
        .list-row::before { content:''; position:absolute; left:-12px; top:0; bottom:0; width:2px; background:var(--accent); border-radius:2px; opacity:0; transition: opacity 0.15s; }
        .list-row:hover { background: var(--accent-soft); }
        .list-row:hover::before { opacity: 1; }

        /* Row enter animation */
        .row-in { animation: rowSlide 0.4s cubic-bezier(0.22,1,0.36,1) both; }

        /* CTA buttons */
        .cta-btn { display:inline-flex; align-items:center; gap:8px; padding:9px 17px; border-radius:8px; font-size:0.85rem; font-weight:500; text-decoration:none; transition:all 0.18s; border:1px solid transparent; color:var(--text2); background:transparent; cursor:pointer; font-family:'Inter',sans-serif; animation: ctaPop 0.4s cubic-bezier(0.22,1,0.36,1) both; }
        .cta-btn:hover { border-color:transparent; color:var(--accent-text); background:var(--accent-soft); transform:translateY(-1px); }
        .cta-btn.primary { background:var(--accent); color:#fafafa; border-color:transparent; }
        .cta-btn.primary:hover { background:#ef4444; transform:translateY(-1px); }

        /* Nav active underline */
        .nav-pill { position:relative; }
        .nav-pill.active::after { content:''; position:absolute; bottom:-1px; left:10px; right:10px; height:1px; background:var(--accent); border-radius:1px; }
        .nav-pill.active { color: var(--text); }

        /* Diff bar */
        .diff-bar-track { height:5px; background: var(--surface3); border-radius: 99px; overflow: hidden; }
        .diff-bar-fill { height:100%; border-radius: 99px; }

        /* Toggle */
        .toggle-wrap { display: inline-flex; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 3px; gap: 2px; flex-wrap: nowrap; white-space: nowrap; }
        .toggle-btn { padding: 6px 15px; border-radius: 4px; font-size: 0.84rem; font-weight: 500; color: var(--muted); transition: color 0.15s; display: inline-flex; align-items: center; gap: 6px; background: none; border: none; cursor: pointer; font-family: 'Inter', sans-serif; white-space: nowrap; }
        .toggle-btn.on { background: var(--surface3); color: var(--text); border: 1px solid var(--border); }

        /* Interactive 3D cube-grid background */
        #bg-canvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
        #root { position: relative; z-index: 1; }
        /* Soft radial scrim — readable center, cubes visible at edges */
        .content-scrim {
            position: relative;
            isolation: isolate;
        }
        .content-scrim::before {
            content: '';
            position: absolute;
            inset: -48px -80px -96px;
            background: radial-gradient(ellipse 78% 65% at 50% 42%, var(--bg) 50%, transparent 100%);
            z-index: -1;
            pointer-events: none;
        }

        .hero-row {
            display: flex;
            align-items: center;
            gap: 22px;
            margin-bottom: 24px;
        }

        .profile-avatar {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            object-fit: cover;
            object-position: center 15%;
            border: none;
            box-shadow: none;
            flex-shrink: 0;
            margin-bottom: 0;
            display: block;
        }

        .hero-bio {
            font-size: 0.9rem;
            line-height: 1.75;
            color: var(--muted);
            max-width: 520px;
            margin-bottom: 22px;
        }

        .stat-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 28px;
        }

        .stat-chip {
            font-size: 0.74rem;
            font-weight: 500;
            padding: 5px 13px;
            border-radius: 999px;
            border: 1px solid var(--border);
            color: var(--text2);
            background: rgba(255, 255, 255, 0.02);
        }

        .stat-chip.accent {
            border-color: var(--accent-border);
            color: var(--accent-text);
            background: var(--accent-soft);
        }

        /* Labs */
        .labs-toolbar {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 20px;
        }
        .labs-search {
            width: 100%;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            font-size: 0.84rem;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: border-color 0.15s;
        }
        .labs-search::placeholder { color: var(--muted); }
        .labs-search:focus { border-color: var(--accent-border); }
        .labs-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }
        .labs-sort {
            display: inline-flex;
            align-items: center;
            gap: 0;
            flex-wrap: wrap;
        }
        .labs-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .labs-empty {
            padding: 32px 0;
            text-align: center;
            font-size: 0.84rem;
            color: var(--muted);
        }

        @media (prefers-reduced-motion: reduce) {
            .fade-up, .fade-up-1, .fade-up-2, .fade-up-3, .row-in, .hero-name, .cta-btn {
                animation: none !important;
            }
            .type-cursor { animation: none; opacity: 1; }
        }
    </style>
</head>
<body>
<canvas id="bg-canvas"></canvas>
<div id="root"></div>
<script>
(function () {
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    let w, h, dpr, time = 0, scale = 36, originX = 0, originY = 0;
    let COLS = 20, ROWS = 20;

    // ── Full-screen isometric red cube grid (dark theme) ─────
    // Soft ambient cubes; hover/click still lift. Frozen when idle.
    const CELL = 1;
    const HALF = 0.40;
    const BASE_H = 0.28;
    const LIFT_MAX = 1.9;
    const HOVER_PX = 150;
    const FRAME_MS = 1000 / 30;
    const IDLE_MS = 1600;

    const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const saveData = !!(navigator.connection && navigator.connection.saveData);
    const coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
    const staticOnly = reduceMotion || saveData || (coarse && Math.min(window.innerWidth, window.innerHeight) < 700);

    let cubes = [];
    let waves = [];
    const mouse = { x: -9999, y: -9999, active: false };
    let running = false;
    let raf = 0;
    let lastFrame = 0;
    let idleTimer = 0;

    function seed() {
        cubes = [];
        const ox = (COLS - 1) * CELL * 0.5;
        const oz = (ROWS - 1) * CELL * 0.5;
        for (let j = 0; j < ROWS; j++) {
            for (let i = 0; i < COLS; i++) {
                const x = i * CELL - ox;
                const z = j * CELL - oz;
                cubes.push({
                    i, j, x, z,
                    h: BASE_H,
                    vh: 0,
                    phase: (i * 0.35 + j * 0.41),
                    sx: 0, sy: 0,
                    depth: x + z,
                });
            }
        }
        cubes.sort((a, b) => a.depth - b.depth);
    }

    function project(x, y, z) {
        return {
            x: originX + (x - z) * scale * 0.866,
            y: originY + (x + z) * scale * 0.5 - y * scale,
        };
    }

    function face(pts) {
        ctx.beginPath();
        ctx.moveTo(pts[0].x, pts[0].y);
        ctx.lineTo(pts[1].x, pts[1].y);
        ctx.lineTo(pts[2].x, pts[2].y);
        ctx.lineTo(pts[3].x, pts[3].y);
        ctx.closePath();
    }

    function drawCube(cx, cz, height, brightness, stroke) {
        const top = height;
        const c1 = project(cx + HALF, 0,   cz - HALF);
        const c2 = project(cx + HALF, 0,   cz + HALF);
        const c3 = project(cx - HALF, 0,   cz + HALF);
        const t0 = project(cx - HALF, top, cz - HALF);
        const t1 = project(cx + HALF, top, cz - HALF);
        const t2 = project(cx + HALF, top, cz + HALF);
        const t3 = project(cx - HALF, top, cz + HALF);

        const b = brightness < 0 ? 0 : brightness > 1 ? 1 : brightness;
        if (stroke) {
            ctx.strokeStyle = `rgba(255, 100, 80, ${0.26 + b * 0.48})`;
            ctx.lineWidth = 0.6;
        }
        ctx.fillStyle = `rgba(130, 18, 18, ${0.11 + b * 0.28})`;
        face([c1, c2, t2, t1]);
        ctx.fill();
        if (stroke) ctx.stroke();
        ctx.fillStyle = `rgba(200, 32, 32, ${0.15 + b * 0.34})`;
        face([c3, c2, t2, t3]);
        ctx.fill();
        if (stroke) ctx.stroke();
        ctx.fillStyle = `rgba(255, 55, 55, ${0.22 + b * 0.44})`;
        face([t0, t1, t2, t3]);
        ctx.fill();
        if (stroke) ctx.stroke();
    }

    function spawnWave(clientX, clientY) {
        if (staticOnly) return;
        let best = null, bestD = Infinity;
        for (let k = 0; k < cubes.length; k++) {
            const c = cubes[k];
            const dx = c.sx - clientX, dy = c.sy - clientY;
            const d = dx * dx + dy * dy;
            if (d < bestD) { bestD = d; best = c; }
        }
        if (!best) return;
        waves.push({ x: best.x, z: best.z, r: 0, speed: 0.26, amp: 1.6, life: 1 });
        best.vh += 0.65;
        kick();
    }

    function poke(x, y) {
        mouse.x = x; mouse.y = y; mouse.active = true;
        kick();
    }

    function kick() {
        if (staticOnly) return;
        clearTimeout(idleTimer);
        idleTimer = setTimeout(() => {
            mouse.active = false;
            if (!waves.length) stop();
        }, IDLE_MS);
        if (!running && document.visibilityState !== 'hidden') start();
    }

    function start() {
        if (running || staticOnly) return;
        running = true;
        lastFrame = 0;
        raf = requestAnimationFrame(step);
    }

    function stop() {
        running = false;
        if (raf) cancelAnimationFrame(raf);
        raf = 0;
    }

    window.addEventListener('mousemove', e => poke(e.clientX, e.clientY), { passive: true });
    window.addEventListener('mouseleave', () => { mouse.active = false; });
    window.addEventListener('touchmove', e => {
        if (e.touches[0]) poke(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });
    window.addEventListener('click', e => spawnWave(e.clientX, e.clientY));
    window.addEventListener('touchstart', e => {
        if (e.touches[0]) spawnWave(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });
    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden') stop();
    });

    function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, staticOnly ? 1 : 1.25);
        w = window.innerWidth;
        h = window.innerHeight;
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.imageSmoothingEnabled = false;

        // Cube size that tiles nicely; expand the grid until the isometric
        // diamond covers the full viewport (diamond ≠ AABB).
        scale = Math.max(18, Math.min(w, h) / 26);
        originX = w * 0.5;
        originY = h * 0.45;
        const halfW = w * 0.5 + 100;
        const halfH = Math.max(originY, h - originY) + 100;
        const nFromDiamond = Math.ceil(halfW / (scale * 0.866) + halfH / (scale * 0.5));
        // Cover the whole screen; idle-freeze + 30fps keep this cheap.
        COLS = Math.min(staticOnly ? 36 : 56, Math.max(30, nFromDiamond));
        ROWS = COLS;
        seed();
        paint(true);
    }

    function paint(forceStatic) {
        ctx.fillStyle = '#0a0a0a';
        ctx.fillRect(0, 0, w, h);

        const glow = ctx.createRadialGradient(originX, originY * 0.85, 0, originX, originY, Math.max(w, h) * 0.72);
        glow.addColorStop(0, 'rgba(160, 18, 18, 0.08)');
        glow.addColorStop(0.5, 'rgba(60, 8, 8, 0.04)');
        glow.addColorStop(1, 'rgba(10, 10, 10, 0)');
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, w, h);

        const animate = !forceStatic && !staticOnly;
        if (animate) {
            waves = waves.filter(wv => wv.life > 0.02 && wv.r < COLS);
            for (let wi = 0; wi < waves.length; wi++) {
                const wv = waves[wi];
                wv.r += wv.speed;
                wv.life *= 0.987;
                wv.amp *= 0.99;
            }
        }

        for (let k = 0; k < cubes.length; k++) {
            const c = cubes[k];
            if (animate) {
                const breathe = Math.sin(time * 1.15 + c.phase) * 0.05;
                let target = BASE_H + breathe;
                if (mouse.active) {
                    const dx = c.sx - mouse.x, dy = c.sy - mouse.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < HOVER_PX) {
                        const t = 1 - dist / HOVER_PX;
                        target += LIFT_MAX * t * t;
                    }
                }
                for (let wi = 0; wi < waves.length; wi++) {
                    const wv = waves[wi];
                    const dx = c.x - wv.x, dz = c.z - wv.z;
                    const d = Math.sqrt(dx * dx + dz * dz);
                    const band = Math.abs(d - wv.r);
                    if (band < 1.4) target += (1 - band / 1.4) * wv.amp * wv.life;
                }
                const force = (target - c.h) * 0.16;
                c.vh = (c.vh + force) * 0.78;
                c.h += c.vh;
                if (c.h < 0.1) { c.h = 0.1; c.vh *= 0.5; }
            }
            const p = project(c.x, c.h, c.z);
            c.sx = p.x; c.sy = p.y;
        }

        for (let k = 0; k < cubes.length; k++) {
            const c = cubes[k];
            if (c.sx < -80 || c.sx > w + 80 || c.sy < -80 || c.sy > h + 80) continue;
            const lift = Math.max(0, Math.min(1, (c.h - BASE_H) / LIFT_MAX));
            const brightness = 0.28 + lift * 0.62 + (animate ? Math.sin(time * 1.1 + c.phase) * 0.03 : 0);
            drawCube(c.x, c.z, c.h, brightness, lift > 0.08);
        }
    }

    function step(now) {
        if (!running) return;
        raf = requestAnimationFrame(step);
        if (now - lastFrame < FRAME_MS) return;
        lastFrame = now;
        time += 0.033;
        paint(false);
        if (!mouse.active && !waves.length) stop();
    }

    let resizeTimer = 0;
    window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(resize, 120);
    });
    resize();
})();
</script>

    const [displayed, setDisplayed] = useState('');

            case 'code': return (
                <pre key={i} style={{margin:'0 0 14px',padding:'11px 14px',background:'rgba(255,255,255,0.04)',border:'1px solid var(--border)',borderRadius:6,fontSize:'0.78rem',color:'var(--text2)',fontFamily:"'DM Mono',monospace",overflowX:'auto',lineHeight:1.7,whiteSpace:'pre-wrap',wordBreak:'break-all'}}>
                    {block.text}
                </pre>
            );
            case 'note': return (
                <div key={i} className="modal-note">
                    <span style={{color:'var(--muted)',fontWeight:600,fontSize:'0.7rem',letterSpacing:'0.06em',textTransform:'uppercase',display:'block',marginBottom:4}}>Note</span>
                    {block.text}
                </div>
            );
            case 'table': return (
                <div key={i} style={{margin:'0 0 16px',overflowX:'auto'}}>
                    <table style={{width:'100%',borderCollapse:'collapse',fontSize:'0.82rem'}}>
                        <thead>
                            <tr style={{borderBottom:'1px solid var(--border2)'}}>
                                {block.headers.map((h,j)=>(
                                    <th key={j} style={{textAlign:'left',padding:'7px 12px',color:'var(--muted)',fontWeight:600,fontSize:'0.7rem',letterSpacing:'0.07em',textTransform:'uppercase',whiteSpace:'nowrap'}}>
                                        {h}
                                    </th>
                                ))}
                            </tr>
                        </thead>
                        <tbody>
                            {block.rows.map((row,j)=>(
                                <tr key={j} style={{borderBottom:'1px solid var(--border)'}}>
                                    {row.map((cell,k)=>(
                                        <td key={k} style={{padding:'8px 12px',color:'var(--text2)',verticalAlign:'top',fontFamily:k===0?"'DM Mono',monospace":'inherit',fontSize:k===0?'0.78rem':'0.82rem'}}>
                                            {cell}
                                        </td>
                                    ))}
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
            );
            case 'figure': return (
                <figure key={i} style={{margin:'20px 0',padding:0}}>
                    <img src={block.src} alt={block.caption||''} loading="lazy" decoding="async" style={{width:'100%',borderRadius:6,border:'1px solid var(--border)',display:'block'}}/>
                    {block.caption && (
                        <figcaption style={{fontSize:'0.75rem',color:'var(--muted)',textAlign:'center',marginTop:6,fontStyle:'italic'}}>
                            {block.caption}
                        </figcaption>
                    )}
                </figure>
            );
            default: return null;
        }
    };

    return (
        <div className="modal-overlay" onClick={onClose}>
            <div className="modal-box" onClick={e=>e.stopPropagation()} style={{maxWidth:600}}>
                <div style={{padding:'22px 22px 18px',borderBottom:'1px solid var(--border)',position:'sticky',top:0,background:'var(--bg)',zIndex:1}}>
                    <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:12}}>
                        <div>
                            <p style={{fontSize:'0.96rem',fontWeight:600,color:'var(--text)',lineHeight:1.3,marginBottom:6}}>{writeup.title}</p>
                            <div style={{display:'flex',gap:12,alignItems:'center'}}>
                                <span style={{fontSize:'0.72rem',color:'var(--muted)'}}>{writeup.category}</span>
                                <span style={{fontSize:'0.72rem',color:DIFF_HEX[writeup.difficulty]||'var(--muted)'}}>{writeup.difficulty}</span>
                                <span style={{fontSize:'0.72rem',color:'var(--muted)'}}>{writeup.date}</span>
                            </div>
                        </div>
                        <button className="modal-close" onClick={onClose} style={{flexShrink:0}}>
                            <Icon name="X" size={14}/>
                        </button>
                    </div>
                </div>
                <div style={{padding:'4px 22px 28px'}}>
                    {writeup.content.map(renderBlock)}
                </div>
            </div>
        </div>
    );
};

const WriteupsPage = () => {
    const [sel, setSel] = useState(null);
    return (
    <div>
        <p style={{...ST}}>Writeups</p>
        <div style={ROW}>
            {(window.WRITEUPS || []).map((w,i)=>(
                <button key={i} onClick={()=>setSel(w)} className="list-row"
                    style={{...rowItem,justifyContent:'space-between',animationDelay:`${i*0.05}s`}}>
                    <div style={{textAlign:'left',flex:1,minWidth:0}}>
                        <p style={{fontSize:'0.9rem',fontWeight:500,color:'var(--text)',marginBottom:4}}>{w.title}</p>
                        <p style={{fontSize:'0.78rem',color:'var(--muted)'}}>{w.summary}</p>
                    </div>
                    <div style={{display:'flex',alignItems:'center',gap:10,flexShrink:0,marginLeft:16}}>
                        <span style={{fontSize:'0.72rem',color:'var(--muted)'}}>{w.category}</span>
                        <span style={{fontSize:'0.72rem',color:DIFF_HEX[w.difficulty]||'var(--muted)'}}>{w.difficulty}</span>
                        <span style={{fontSize:'0.72rem',color:'var(--muted)'}}>{w.date}</span>
                    </div>
                </button>
            ))}
        </div>
        {sel && <WriteupModal writeup={sel} onClose={()=>setSel(null)}/>}
    </div>
    );
};

// ── App ───────────────────────────────────────────────────────
const App = () => {
    const [page, setPage] = useState('home');
    const view = page === 'certs' ? <CertsPage/>
        : page === 'projects' ? <ProjectsPage/>
        : page === 'writeups' ? <WriteupsPage/>
        : page === 'competitions' ? <CompetitionsPage/>
        : page === 'experience' ? <ExperiencePage/>
        : <HomePage/>;
    return (
    <div style={{minHeight:'100vh'}}>
        <nav style={{position:'sticky',top:0,zIndex:50,background:'var(--bg)',borderBottom:'1px solid var(--border)'}}>
            <div style={{maxWidth:720,margin:'0 auto',padding:'0 24px',display:'flex',alignItems:'center',justifyContent:'space-between',height:50,gap:8}}>
                <button onClick={()=>setPage('home')} style={{background:'none',border:'none',cursor:'pointer',fontSize:'0.9rem',fontWeight:600,color:'var(--text)',letterSpacing:'-0.01em'}}>
                    johann.
                </button>
                <div style={{display:'flex',gap:0,flexWrap:'nowrap',justifyContent:'flex-end',alignItems:'center'}}>
                    {NAV.map(item=>(
                        <button key={item.id} onClick={()=>setPage(item.id)} className={`nav-pill ${page===item.id?'active':''}`}>
                            {item.label}
                        </button>
                    ))}
                </div>
            </div>
        </nav>
        <main className="content-scrim" style={{maxWidth:720,margin:'0 auto',padding:'48px 24px 100px'}}>
            {view}
        </main>
        <footer style={{borderTop:'1px solid var(--border)',padding:'20px 24px'}}>
            <div style={{maxWidth:720,margin:'0 auto',textAlign:'center'}}>
                <span style={{fontSize:'0.72rem',color:'var(--muted)'}}>© 2026 Johann Weingertner</span>
            </div>
        </footer>
    </div>
    );
};

ReactDOM.render(<App />, document.getElementById('root'));
</script>
