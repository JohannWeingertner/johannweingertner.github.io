<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>johannweingertner.github.io</title>
    <!-- Favicon - Custom shield SVG matching cybersecurity theme (steel blue) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%233b82f6'%3E%3Cpath d='M12 2L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-3z'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@0.441.0/dist/umd/lucide.js"></script>
    <!-- ── Data files — edit these to update content ── -->
    <script src="/data/certifications.js"></script>
    <script src="/data/labs.js"></script>
    <script src="/data/writeups.js"></script>
    <style>
        :root {
            --bg:        #0a0a0a;
            --surface:   #111111;
            --surface2:  #161616;
            --surface3:  #1c1c1c;
            --primary:   #d4d4d4;
            --primary-light: #e5e5e5;
            --primary-dim: #404040;
            --accent-cyan:    #a3a3a3;
            --accent-emerald: #a3a3a3;
            --accent-amber:   #a3a3a3;
            --accent-slate:   #737373;
            --text:      #e5e5e5;
            --text2:     #a3a3a3;
            --muted:     #525252;
            --border:    rgba(255,255,255,0.05);
            --border2:   rgba(255,255,255,0.09);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; font-feature-settings: 'cv11', 'ss01'; }
        .mono { font-family: 'DM Mono', monospace; }

        /* Cards */
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; position: relative; overflow: hidden; transition: border-color 0.2s; }
        .card:hover { border-color: var(--border2); transform: none; box-shadow: none; }

        /* Nav */
        .nav-pill { border-radius: 0; padding: 5px 8px; font-size: 0.82rem; font-weight: 450; transition: color 0.15s; color: var(--muted); background: none; border: none; cursor: pointer; display: flex; align-items: center; gap: 5px; font-family: 'Inter', sans-serif; white-space: nowrap; }
        .nav-pill:hover { color: var(--text2); background: none; }
        .nav-pill.active { background: none; color: var(--text); border: none; }

        /* Tags - modern professional colors */
        .ptag { font-family: 'Inter', sans-serif; font-size: 0.67rem; padding: 2px 8px; border-radius: 5px; font-weight: 500; background: rgba(255,255,255,0.05); color: var(--text2); border: 1px solid rgba(255,255,255,0.08); }
        .ptag-primary { background: rgba(255,255,255,0.05); color: var(--text2); border: 1px solid rgba(255,255,255,0.08); }
        .ptag-cyan   { background: rgba(255,255,255,0.05); color: var(--text2); border: 1px solid rgba(255,255,255,0.08); }
        .ptag-emerald{ background: rgba(255,255,255,0.05); color: var(--text2); border: 1px solid rgba(255,255,255,0.08); }
        .ptag-amber  { background: rgba(255,255,255,0.05); color: var(--text2); border: 1px solid rgba(255,255,255,0.08); }
        .ptag-slate  { background: rgba(255,255,255,0.04); color: var(--muted); border: 1px solid rgba(255,255,255,0.07); }

        /* Skill pills */
        .skill-pill { background: rgba(255,255,255,0.04); border: 1px solid var(--border); color: var(--text2); font-size: 0.78rem; padding: 4px 12px; border-radius: 999px; transition: color 0.15s, border-color 0.15s; }
        .skill-pill:hover { border-color: var(--border2); color: var(--text); background: rgba(255,255,255,0.06); }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 4px; }

        /* Animations */
        @keyframes fadeUp   { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:translateY(0); } }
        @keyframes fadeIn   { from { opacity:0; } to { opacity:1; } }
        @keyframes typeBlink { 0%,100%{opacity:1;} 50%{opacity:0;} }
        @keyframes modalIn  { from{opacity:0;transform:scale(0.93) translateY(10px);} to{opacity:1;transform:scale(1) translateY(0);} }
        @keyframes slideDown { from{opacity:0;transform:translateY(-6px);} to{opacity:1;transform:translateY(0);} }
        @keyframes nameGlow { 0%,100%{text-shadow:none;} 50%{text-shadow:0 0 60px rgba(255,255,255,0.07);} }
        @keyframes rowSlide { from{opacity:0;transform:translateX(-10px);} to{opacity:1;transform:translateX(0);} }
        @keyframes ctaPop   { 0%{opacity:0;transform:scale(0.9) translateY(6px);} 100%{opacity:1;transform:scale(1) translateY(0);} }

        .fade-up   { animation: fadeUp 0.5s cubic-bezier(0.22,1,0.36,1) both; }
        .fade-up-1 { animation: fadeUp 0.5s 0.08s cubic-bezier(0.22,1,0.36,1) both; }
        .fade-up-2 { animation: fadeUp 0.5s 0.16s cubic-bezier(0.22,1,0.36,1) both; }
        .fade-up-3 { animation: fadeUp 0.5s 0.24s cubic-bezier(0.22,1,0.36,1) both; }
        .slide-down { animation: slideDown 0.15s ease both; }
        .type-cursor { display:inline-block; width:2px; height:1em; background:var(--text2); margin-left:2px; vertical-align:text-bottom; animation:typeBlink 0.75s step-end infinite; }
        .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.8); backdrop-filter:blur(12px); z-index:10000; display:flex; align-items:center; justify-content:center; padding:1rem; animation:fadeIn 0.18s ease both; }
        .modal-box { background:var(--surface); border:1px solid var(--border2); border-radius:12px; max-width:520px; width:100%; max-height:85vh; overflow-y:auto; animation:modalIn 0.25s cubic-bezier(0.34,1.2,0.64,1) both; box-shadow:0 20px 50px rgba(0,0,0,0.4); }
        .modal-box::-webkit-scrollbar { width:3px; }
        .modal-box::-webkit-scrollbar-thumb { background:var(--surface3); border-radius:2px; }

        /* Name heading glow */
        .hero-name { animation: nameGlow 5s ease-in-out infinite; }

        /* List row hover highlight */
        .list-row { position: relative; transition: background 0.15s; cursor: pointer; }
        .list-row::before { content:''; position:absolute; left:-12px; top:0; bottom:0; width:2px; background:var(--text2); border-radius:2px; opacity:0; transition: opacity 0.15s; }
        .list-row:hover { background: rgba(255,255,255,0.025); }
        .list-row:hover::before { opacity: 1; }

        /* Row enter animation */
        .row-in { animation: rowSlide 0.4s cubic-bezier(0.22,1,0.36,1) both; }

        /* CTA buttons */
        .cta-btn { display:inline-flex; align-items:center; gap:8px; padding:9px 17px; border-radius:8px; font-size:0.85rem; font-weight:500; text-decoration:none; transition:all 0.18s; border:1px solid var(--border); color:var(--text2); background:rgba(255,255,255,0.03); cursor:pointer; font-family:'Inter',sans-serif; animation: ctaPop 0.4s cubic-bezier(0.22,1,0.36,1) both; }
        .cta-btn:hover { border-color:var(--border2); color:var(--text); background:rgba(255,255,255,0.06); transform:translateY(-1px); }
        .cta-btn.primary { background:var(--text); color:#0a0a0a; border-color:transparent; }
        .cta-btn.primary:hover { background:var(--primary-light); transform:translateY(-1px); }

        /* Nav active underline */
        .nav-pill { position:relative; }
        .nav-pill.active::after { content:''; position:absolute; bottom:-1px; left:10px; right:10px; height:1px; background:var(--text2); border-radius:1px; }

        /* Diff bar */
        .diff-bar-track { height:5px; background: var(--surface3); border-radius: 99px; overflow: hidden; }
        .diff-bar-fill { height:100%; border-radius: 99px; }

        /* Toggle */
        .toggle-wrap { display: inline-flex; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 3px; gap: 2px; flex-wrap: nowrap; white-space: nowrap; }
        .toggle-btn { padding: 6px 15px; border-radius: 4px; font-size: 0.84rem; font-weight: 500; color: var(--muted); transition: color 0.15s; display: inline-flex; align-items: center; gap: 6px; background: none; border: none; cursor: pointer; font-family: 'Inter', sans-serif; white-space: nowrap; }
        .toggle-btn.on { background: var(--surface3); color: var(--text); border: 1px solid var(--border); }
    </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const Icon = ({ name, className = '', size = 15, ...props }) => {
    const ref = useRef(null);
    useEffect(() => {
        if (ref.current && lucide[name]) {
            const el = lucide.createElement(lucide[name], { width: size, height: size, 'stroke-width': 1.75 });
            ref.current.innerHTML = ''; ref.current.appendChild(el);
        }
    }, [name, size]);
    return <i ref={ref} className={`flex-shrink-0 ${className}`} style={{display:'inline-flex',alignItems:'center',justifyContent:'center',width:size,height:size}} {...props} />;
};

const useTyping = (text, speed = 42, delay = 800) => {
    const [displayed, setDisplayed] = useState('');
    const [done, setDone] = useState(false);
    useEffect(() => {
        setDisplayed(''); setDone(false); let i = 0;
        const t = setTimeout(() => {
            const iv = setInterval(() => { i++; setDisplayed(text.slice(0,i)); if(i>=text.length){clearInterval(iv);setDone(true);} }, speed);
            return () => clearInterval(iv);
        }, delay);
        return () => clearTimeout(t);
    }, [text]);
    return { displayed, done };
};

// ── Static data ───────────────────────────────────────────────
const SKILLS = [
    { category:'SIEM & Threat Hunting', color:'primary', items:['Splunk SPL','Sentinel KQL','Log Analysis','Threat Hunting','AWS CloudTrail','Azure Sentinel'] },
    { category:'Digital Forensics',     color:'cyan',    items:['Memory Forensics','Disk Forensics','Windows Event Logs','FTK Imager','Autopsy','Volatility','EZ Tools'] },
    { category:'Network & Traffic',     color:'emerald', items:['Traffic Analysis','Wireshark','Port Scan Detection','Beaconing Analysis'] },
    { category:'Cloud & Infrastructure',color:'amber',   items:['Cloud Security (Azure & AWS)','Active Directory','DHCP/DNS','GuardDuty'] },
    { category:'Intel & OSINT',         color:'slate',   items:['OSINT','OleTools','Phishing Analysis','VBA Macro Analysis','IOC Identification'] },
];
const EXPERIENCE = [{
    role:'Cybersecurity Intern', org:'Chesterfield County IST Department', period:'June 2025 – February 2026',
    bullets:['Participated in tabletop exercise simulating cybersecurity incident response','Gained exposure to enterprise ticketing, security workflows, and professional mindset','Developed understanding of compliance auditing and cybersecurity insurance requirements','Observed security team communication and documentation practices'],
}];
const COMPETITIONS = [
    { name:'National Cyber League (NCL)', detail:'Top 15% overall (Rank 1189 / 7875) · Top 9% High School bracket (Rank 91 / 1046)', icon:'Trophy', color:'primary', period:'Fall 2025' },
    { name:'CyberPatriot',                detail:'Top 30% — Windows hardening, vulnerability auditing, malware hunting',                icon:'Shield', color:'emerald', period:'2025' },
];
const NAV = [
    { id:'home',         label:'Home'       },
    { id:'certs',        label:'Certs'      },
    { id:'projects',     label:'Labs'       },
    { id:'competitions', label:'CTFs'       },
    { id:'experience',   label:'Experience' },
    { id:'skills',       label:'Skills'     },
    { id:'writeups',     label:'Writeups'   },
];

const DIFF_COLOR = { Easy:'emerald', Medium:'amber', Hard:'amber', Extreme:'slate' };
const DIFF_HEX   = { Easy:'#a3a3a3', Medium:'#a3a3a3', Hard:'#737373', Extreme:'#525252' };

// ── Shared style tokens ───────────────────────────────────────
const ST = {fontSize:'0.7rem',fontWeight:600,color:'var(--muted)',letterSpacing:'0.09em',textTransform:'uppercase',marginBottom:24};
const ROW = {borderTop:'1px solid var(--border)'};
const rowItem = {display:'flex',alignItems:'center',width:'100%',padding:'13px 0',borderBottom:'1px solid var(--border)',background:'none',border:'none',borderBottom:'1px solid var(--border)',cursor:'pointer',textAlign:'left',gap:0};

// ── Components ────────────────────────────────────────────────
const CertBadgeImg = ({ src, alt, fallback, size=44 }) => (
    <div style={{width:size,height:size,borderRadius:7,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,overflow:'hidden',background:'var(--surface2)',border:'1px solid var(--border)'}}>
        <img src={src} alt={alt} style={{width:'100%',height:'100%',objectFit:'contain',padding:5}}
            onError={e=>{e.target.style.display='none';e.target.nextSibling.style.display='flex';}} />
        <span style={{color:'var(--muted)',display:'none',width:'100%',height:'100%',alignItems:'center',justifyContent:'center',textAlign:'center',fontSize:'0.6rem',fontWeight:600}}>{fallback}</span>
    </div>
);

const CertModal = ({ cert, onClose }) => {
    useEffect(() => {
        const h = (e) => { if (e.key === 'Escape') onClose(); };
        document.addEventListener('keydown', h);
        return () => document.removeEventListener('keydown', h);
    }, [onClose]);
    return (
        <div className="modal-overlay" onClick={onClose}>
            <div className="modal-box" onClick={e=>e.stopPropagation()}>
                <div style={{padding:'22px 22px 18px',borderBottom:'1px solid var(--border)'}}>
                    <div style={{display:'flex',alignItems:'flex-start',gap:14}}>
                        <CertBadgeImg src={cert.badge} alt={cert.short} fallback={cert.short} size={48}/>
                        <div style={{flex:1,minWidth:0}}>
                            <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:8}}>
                                <p style={{fontSize:'0.94rem',fontWeight:600,color:'var(--text)',lineHeight:1.3}}>{cert.name}</p>
                                <button onClick={onClose} style={{color:'var(--muted)',background:'none',border:'none',cursor:'pointer',flexShrink:0,padding:2}}>
                                    <Icon name="X" size={14}/>
                                </button>
                            </div>
                            <p style={{fontSize:'0.76rem',color:'var(--muted)',marginTop:4}}>{cert.issuer} · {cert.year}</p>
                        </div>
                    </div>
                    {cert.description && <p style={{marginTop:14,fontSize:'0.84rem',lineHeight:1.7,color:'var(--text2)'}}>{cert.description}</p>}
                </div>
                {cert.learned && cert.learned.length > 0 && (
                    <div style={{padding:'16px 22px'}}>
                        <p style={{...ST,marginBottom:10}}>What I learned</p>
                        <div style={{display:'flex',flexDirection:'column',gap:8}}>
                            {cert.learned.map((item,i)=>(
                                <div key={i} style={{display:'flex',alignItems:'flex-start',gap:10,fontSize:'0.83rem',color:'var(--text2)'}}>
                                    <span style={{color:'var(--border2)',flexShrink:0}}>—</span>{item}
                                </div>
                            ))}
                        </div>
                    </div>
                )}
                {cert.url && (
                    <div style={{padding:'14px 22px 20px',borderTop:'1px solid var(--border)'}}>
                        <a href={cert.url} target="_blank" rel="noopener noreferrer" style={{color:'var(--text2)',textDecoration:'none',fontSize:'0.83rem',display:'inline-flex',alignItems:'center',gap:6}}>
                            View credential <Icon name="ExternalLink" size={13}/>
                        </a>
                    </div>
                )}
            </div>
        </div>
    );
};

// ── Pages ─────────────────────────────────────────────────────
const HomePage = ({ setPage }) => {
    const { displayed, done } = useTyping('Networking & Cybersecurity', 43, 800);
    const ctaLinks = [
        {label:'LinkedIn',       icon:'Linkedin', href:'https://www.linkedin.com/in/johann-weingertner-61b884358/', primary:true},
        {label:'GitHub',         icon:'Github',   href:'https://github.com/JohannWeingertner'},
        {label:'CyberDefenders', icon:'Shield',   href:'https://cyberdefenders.org/p/Afterguard/'},
    ];
    const highlights = [
        {label:'Certifications',  val:'7 active',                          nav:'certs'},
        {label:'Lab Hours',       val:'250+ hrs · Top 100 CyberDefenders', nav:'projects'},
        {label:'Experience',      val:'Chesterfield County IST Dept.',      nav:'experience'},
        {label:'Competitions',    val:'NCL Top 15% · CyberPatriot Top 30%',nav:'competitions'},
    ];
    return (
    <div style={{display:'flex',flexDirection:'column',gap:56}}>
        <div style={{paddingTop:16}} className="fade-up">
            <h1 className="hero-name" style={{fontSize:'clamp(2rem,6vw,3rem)',fontWeight:700,color:'var(--text)',letterSpacing:'-0.03em',lineHeight:1.1,marginBottom:12}}>
                Afterguard
            </h1>
            <p style={{fontSize:'0.95rem',color:'var(--text2)',marginBottom:22,minHeight:'1.5em'}}>
                {displayed}{!done && <span className="type-cursor"/>}
            </p>
            <p style={{fontSize:'0.9rem',lineHeight:1.85,color:'var(--muted)',maxWidth:520,marginBottom:32}}>
                Aspiring networking and cybersecurity professional with hands-on experience across both disciplines.
                On the networking side, I've worked with Cisco devices, built homelabs, and am actively studying for my CCNA.
                On the security side, I've job shadowed at Chesterfield County, accumulated 250+ hours in the CyberDefenders CyberRange, and hold 7 active industry certifications.
            </p>
            <div style={{display:'flex',flexWrap:'wrap',gap:10}}>
                {ctaLinks.map((b,i)=>(
                    <a key={i} href={b.href} target="_blank" rel="noopener noreferrer"
                       className={`cta-btn${b.primary?' primary':''}`}
                       style={{animationDelay:`${i*0.08}s`}}>
                        <Icon name={b.icon} size={14}/>{b.label}
                    </a>
                ))}
            </div>
        </div>
        <div className="fade-up-1">
            <p style={{...ST}}>Highlights</p>
            <div style={ROW}>
                {highlights.map((row,i)=>(
                    <button key={i} onClick={()=>setPage(row.nav)}
                        className="list-row"
                        style={{...rowItem,justifyContent:'space-between',animationDelay:`${0.1+i*0.06}s`}}>
                        <span style={{fontSize:'0.88rem',color:'var(--text2)',transition:'color 0.15s'}}>{row.label}</span>
                        <span style={{fontSize:'0.82rem',color:'var(--muted)'}}>{row.val} <span style={{marginLeft:4,opacity:0.5}}>→</span></span>
                    </button>
                ))}
            </div>
        </div>
    </div>
    );
};

const CertsPage = () => {
    const [sel, setSel] = useState(null);
    const all = CERTIFICATIONS || [];
    return (
    <div>
        <p style={{...ST}}>Certifications</p>
        <div style={ROW}>
            {all.map((c,i)=>(
                <button key={i} onClick={()=>setSel(c)} className="list-row"
                    style={{...rowItem,justifyContent:'space-between',animationDelay:`${i*0.04}s`}}>
                    <div style={{display:'flex',alignItems:'center',gap:14}}>
                        <CertBadgeImg src={c.badge} alt={c.short} fallback={c.short} size={38}/>
                        <div style={{textAlign:'left'}}>
                            <p style={{fontSize:'0.88rem',fontWeight:500,color:'var(--text)',marginBottom:2}}>{c.name}</p>
                            <p style={{fontSize:'0.74rem',color:'var(--muted)'}}>{c.issuer} · {c.year}</p>
                        </div>
                    </div>
                    <Icon name="ChevronRight" size={14} style={{color:'var(--muted)',flexShrink:0,transition:'transform 0.15s'}}/>
                </button>
            ))}
        </div>
        {sel && <CertModal cert={sel} onClose={()=>setSel(null)}/>}
    </div>
    );
};

const ProjectsPage = () => {
    const [sortBy, setSortBy] = useState('date');
    const total = CD_LABS?.length || 0;
    const counts = CD_LABS?.reduce((a,l)=>{a[l.difficulty]=(a[l.difficulty]||0)+1;return a;},{}) || {};

    const sortedLabs = React.useMemo(() => {
        if (!CD_LABS) return [];
        const copy = [...CD_LABS];
        if (sortBy === 'date') return copy.sort((a,b)=>{ if(!a.completed)return 1; if(!b.completed)return -1; return new Date(b.completed)-new Date(a.completed); });
        const ord = {Easy:0,Medium:1,Hard:2,Extreme:3};
        return copy.sort((a,b)=>(ord[a.difficulty]??4)-(ord[b.difficulty]??4)||a.name.localeCompare(b.name));
    }, [sortBy]);

    return (
    <div>
        <div>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:18,flexWrap:'wrap',gap:8}}>
                <p style={{...ST,marginBottom:0}}>CyberDefenders Labs</p>
                <div style={{display:'flex',alignItems:'center',gap:12}}>
                    <div className="toggle-wrap">
                        {[{id:'date',label:'Date'},{id:'difficulty',label:'Difficulty'}].map(t=>(
                            <button key={t.id} onClick={()=>setSortBy(t.id)} className={`toggle-btn ${sortBy===t.id?'on':''}`}>{t.label}</button>
                        ))}
                    </div>
                    <a href="https://cyberdefenders.org/p/Afterguard/" target="_blank" rel="noopener noreferrer"
                       style={{fontSize:'0.75rem',color:'var(--muted)',textDecoration:'none'}}>Profile ↗</a>
                </div>
            </div>
            <p style={{fontSize:'0.78rem',color:'var(--muted)',marginBottom:14}}>
                {total} completed · Easy {counts.Easy||0} · Medium {counts.Medium||0} · Hard {counts.Hard||0}
            </p>
            <div style={ROW}>
                {sortedLabs.map((lab,i)=>(
                    <a key={i} href={lab.url} target="_blank" rel="noopener noreferrer"
                       className="list-row"
                       style={{display:'flex',alignItems:'center',padding:'11px 0',borderBottom:'1px solid var(--border)',textDecoration:'none',gap:12}}>
                        <span style={{fontSize:'0.86rem',color:'var(--text)',flex:1,minWidth:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{lab.name}</span>
                        <div style={{display:'flex',alignItems:'center',gap:10,flexShrink:0}}>
                            <span style={{fontSize:'0.72rem',color:'var(--muted)'}}>{lab.category}</span>
                            {lab.difficulty && <span style={{fontSize:'0.72rem',color:DIFF_HEX[lab.difficulty]||'var(--muted)'}}>{lab.difficulty}</span>}
                            {lab.completed && <span style={{fontSize:'0.72rem',color:'var(--muted)'}}>{lab.completed}</span>}
                        </div>
                    </a>
                ))}
            </div>
        </div>

    </div>
    );
};

const CompetitionsPage = () => (
    <div>
        <p style={{...ST}}>Competitions</p>
        <div style={ROW}>
            {COMPETITIONS.map((c,i)=>(

                <div key={i} style={{display:'flex',gap:20,padding:'14px 0',borderBottom:'1px solid var(--border)',flexWrap:'wrap'}}>

const WriteupModal = ({ writeup, onClose }) => {
    useEffect(() => {
        const h = (e) => { if (e.key === 'Escape') onClose(); };
        document.addEventListener('keydown', h);
        document.body.style.overflow = 'hidden';
        return () => { document.removeEventListener('keydown', h); document.body.style.overflow = ''; };
    }, [onClose]);

    const renderBlock = (block, i) => {
        switch (block.type) {
            case 'h2': return (
                <p key={i} style={{fontSize:'0.7rem',fontWeight:600,color:'var(--muted)',letterSpacing:'0.09em',textTransform:'uppercase',marginTop:28,marginBottom:10}}>
                    {block.text}
                </p>
            );
            case 'h3': return (
                <p key={i} style={{fontSize:'0.84rem',fontWeight:600,color:'var(--text)',marginTop:16,marginBottom:8}}>
                    {block.text}
                </p>
            );
            case 'p': return (
                <p key={i} style={{fontSize:'0.87rem',lineHeight:1.8,color:'var(--text2)',marginBottom:10}}>
                    {block.text}
                </p>
            );
            case 'ul': return (
                <ul key={i} style={{listStyle:'none',padding:0,margin:'0 0 12px',display:'flex',flexDirection:'column',gap:6}}>
                    {block.items.map((item,j)=>(
                        <li key={j} style={{display:'flex',alignItems:'flex-start',gap:10,fontSize:'0.86rem',color:'var(--text2)'}}>
                            <span style={{color:'var(--muted)',flexShrink:0}}>—</span>{item}
                        </li>
                    ))}
                </ul>
            );
            case 'ol': return (
                <ol key={i} style={{listStyle:'none',padding:0,margin:'0 0 12px',display:'flex',flexDirection:'column',gap:6,counterReset:'ol-counter'}}>
                    {block.items.map((item,j)=>(
                        <li key={j} style={{display:'flex',alignItems:'flex-start',gap:10,fontSize:'0.86rem',color:'var(--text2)'}}>
                            <span style={{color:'var(--muted)',flexShrink:0,minWidth:16,fontVariantNumeric:'tabular-nums'}}>{j+1}.</span>{item}
                        </li>
                    ))}
                </ol>
            );
            case 'code': return (
                <pre key={i} style={{margin:'0 0 14px',padding:'11px 14px',background:'rgba(255,255,255,0.04)',border:'1px solid var(--border)',borderRadius:6,fontSize:'0.78rem',color:'var(--text2)',fontFamily:"'DM Mono',monospace",overflowX:'auto',lineHeight:1.7,whiteSpace:'pre-wrap',wordBreak:'break-all'}}>
                    {block.text}
                </pre>
            );
            case 'note': return (
                <div key={i} style={{margin:'0 0 14px',padding:'11px 14px',background:'rgba(255,255,255,0.03)',borderLeft:'2px solid var(--border2)',borderRadius:'0 6px 6px 0',fontSize:'0.83rem',color:'var(--text2)',lineHeight:1.7}}>
                    <span style={{color:'var(--muted)',fontWeight:600,fontSize:'0.7rem',letterSpacing:'0.06em',textTransform:'uppercase',display:'block',marginBottom:4}}>Note</span>
                    {block.text}
                </div>
            );
            case 'table': return (
                <div key={i} style={{margin:'0 0 16px',overflowX:'auto'}}>
                    <table style={{width:'100%',borderCollapse:'collapse',fontSize:'0.82rem'}}>
                        <thead>
                            <tr style={{borderBottom:'1px solid var(--border2)'}}>
                                {block.headers.map((h,j)=>(
                                    <th key={j} style={{textAlign:'left',padding:'7px 12px',color:'var(--muted)',fontWeight:600,fontSize:'0.7rem',letterSpacing:'0.07em',textTransform:'uppercase',whiteSpace:'nowrap'}}>
                                        {h}
                                    </th>
                                ))}
                            </tr>
                        </thead>
                        <tbody>
                            {block.rows.map((row,j)=>(
                                <tr key={j} style={{borderBottom:'1px solid var(--border)'}}>
                                    {row.map((cell,k)=>(
                                        <td key={k} style={{padding:'8px 12px',color:'var(--text2)',verticalAlign:'top',fontFamily:k===0?"'DM Mono',monospace":'inherit',fontSize:k===0?'0.78rem':'0.82rem'}}>
                                            {cell}
                                        </td>
                                    ))}
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
            );
            case 'figure': return (
                <figure key={i} style={{margin:'20px 0',padding:0}}>
                    <img src={block.src} alt={block.caption||''} style={{width:'100%',borderRadius:6,border:'1px solid var(--border)',display:'block'}}/>
                    {block.caption && (
                        <figcaption style={{fontSize:'0.75rem',color:'var(--muted)',textAlign:'center',marginTop:6,fontStyle:'italic'}}>
                            {block.caption}
                        </figcaption>
                    )}
                </figure>
            );
            default: return null;
        }
    };

    return (
        <div className="modal-overlay" onClick={onClose}>
            <div className="modal-box" onClick={e=>e.stopPropagation()} style={{maxWidth:600}}>
                <div style={{padding:'22px 22px 18px',borderBottom:'1px solid var(--border)',position:'sticky',top:0,background:'var(--surface)',zIndex:1}}>
                    <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:12}}>
                        <div>
                            <p style={{fontSize:'0.96rem',fontWeight:600,color:'var(--text)',lineHeight:1.3,marginBottom:6}}>{writeup.title}</p>
                            <div style={{display:'flex',gap:12,alignItems:'center'}}>
                                <span style={{fontSize:'0.72rem',color:'var(--muted)'}}>{writeup.category}</span>
                                <span style={{fontSize:'0.72rem',color:DIFF_HEX[writeup.difficulty]||'var(--muted)'}}>{writeup.difficulty}</span>
                                <span style={{fontSize:'0.72rem',color:'var(--muted)'}}>{writeup.date}</span>
                            </div>
                        </div>
                        <button onClick={onClose} style={{color:'var(--muted)',background:'none',border:'none',cursor:'pointer',padding:2,flexShrink:0}}>
                            <Icon name="X" size={14}/>
                        </button>
                    </div>
                </div>
                <div style={{padding:'4px 22px 28px'}}>
                    {writeup.content.map(renderBlock)}
                </div>
            </div>
        </div>
    );
};

};

ReactDOM.render(<App />, document.getElementById('root'));
</script>
