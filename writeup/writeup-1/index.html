  <h1>Shadow Token Symphony — APT29 Azure Compromise</h1>
  <p>Cloud / DFIR · Hard · Apr 2026</p>
  <p>Full attack-chain investigation of a multi-stage APT29-style Azure environment compromise — from on-premises brute force through Key Vault exfiltration — using Microsoft Sentinel.</p>
  <h2>Overview</h2>
<p>InfiniteTechSolutions experienced a sophisticated, multi-stage cyber attack against their Azure environment in July 2025. The attack was detected by Microsoft Sentinel through anomalous login patterns, unauthorized service installations, and suspicious API calls targeting the Microsoft Graph endpoint.</p>
<p>The threat actor executed a full attack chain beginning with on-premises reconnaissance and brute-force attacks, escalating to Azure AD credential compromise via password spray, followed by lateral movement, privilege escalation, persistence establishment, and culminating in data exfiltration from Azure Key Vaults.</p>
<table><thead><tr><th>Field</th><th>Value</th></tr></thead><tbody><tr><td>Incident Date</td><td>July 2025</td></tr><tr><td>Organization</td><td>InfiniteTechSolutions (infinitechsolutions.xyz)</td></tr><tr><td>Platform</td><td>Microsoft Azure / Microsoft Sentinel</td></tr><tr><td>Analyst</td><td>Johann Weingertner</td></tr><tr><td>Report Date</td><td>April 11, 2026</td></tr><tr><td>Lab Platform</td><td>CyberDefenders</td></tr><tr><td>Lab</td><td>Shadow Token Symphony - APT29</td></tr></tbody></table>
<figure><img src="/assets/writeups/soc-apt29/fig01-azure-topology.webp" alt="Figure 1 — InfiniteTechSolutions Azure environment topology monitored by Microsoft Sentinel" loading="lazy" decoding="async" /><figcaption>Figure 1 — InfiniteTechSolutions Azure environment topology monitored by Microsoft Sentinel</figcaption></figure>
<h2>Attack Timeline</h2>
<table><thead><tr><th>Phase</th><th>Timestamp</th><th>Activity</th></tr></thead><tbody><tr><td>1</td><td>Prior to 2025-07-01</td><td>Initial recon: login failures across 4 machines on-premises; ITWS01 primary target</td></tr><tr><td>2</td><td>Pre-compromise</td><td>Malicious service 'c316a11' installed on ITWS01 using account 'infinitetechadmin'</td></tr><tr><td>3</td><td>Post-install</td><td>Password spray attack launched against Azure AD — 63 failed auth attempts</td></tr><tr><td>4</td><td>2025-07-01 19:21</td><td>First successful Azure AD authentication — account Maya Wilson compromised</td></tr><tr><td>5</td><td>2025-07-01 19:25</td><td>Non-interactive token auth (refreshToken) — 4 minutes after initial compromise</td></tr><tr><td>6</td><td>Ongoing</td><td>Graph API reconnaissance from 48.211.64.27 — user enumeration &amp; org recon</td></tr><tr><td>7</td><td>Post-recon</td><td>Azure Automation Account 'DAILYCHECKER' repurposed; runbook 'UsersReminders' created</td></tr><tr><td>8</td><td>Post-persistence</td><td>Privilege escalation — tom.clarkson@infinitechsolutions.xyz added as app owner (App ID: 9999-8888)</td></tr><tr><td>9</td><td>Post-escalation</td><td>Runbook updated from IP 35.158.160.255; Key Vault exfiltration begins</td></tr><tr><td>10</td><td>Final stage</td><td>Secrets extracted from CORP-KV-PROD, INFRA-BACKUP-KV, and FINANCE-KV-EU</td></tr></tbody></table>
<h2>3. Initial Reconnaissance &amp; Machine Compromise</h2>
<h3>3.1 Login Failure Analysis</h3>
<p>Analysis of Windows Event logs revealed that 4 distinct computer names experienced login failures during the initial reconnaissance phase. The volume and distribution of these failures indicate systematic brute-force activity across the on-premises environment.</p>
<ul><li>Distinct machines targeted: 4</li><li>Primary target machine: ITWS01</li><li>Basis for primary target determination: Highest volume of failed authentication attempts</li></ul>
<figure><img src="/assets/writeups/soc-apt29/fig02-login-failures.webp" alt="Figure 2 — Windows Event log showing failed authentication attempts across target machines (ITWS01: 17, HRWS02: 11, FINWS01: 10, ITWS03: 9)" loading="lazy" decoding="async" /><figcaption>Figure 2 — Windows Event log showing failed authentication attempts across target machines (ITWS01: 17, HRWS02: 11, FINWS01: 10, ITWS03: 9)</figcaption></figure>
<h3>3.2 Malicious Service Installation</h3>
<p>Following the successful compromise of ITWS01, the threat actor installed a malicious service to establish a foothold. The service installation event was recorded in the Windows Security Event logs.</p>
<table><thead><tr><th>Field</th><th>Value</th></tr></thead><tbody><tr><td>Malicious Service Name</td><td>c316a11</td></tr><tr><td>Target Machine</td><td>ITWS01</td></tr><tr><td>Account Used</td><td>infinitetechadmin</td></tr><tr><td>Account Type</td><td>Privileged (administrative)</td></tr></tbody></table>
<figure><img src="/assets/writeups/soc-apt29/fig03-malicious-service.webp" alt="Figure 3 — Windows Event log showing malicious service 'c316a11' installed on ITWS01" loading="lazy" decoding="async" /><figcaption>Figure 3 — Windows Event log showing malicious service 'c316a11' installed on ITWS01</figcaption></figure>
<figure><img src="/assets/writeups/soc-apt29/fig04-service-privileged.webp" alt="Figure 4 — Windows Event log showing malicious service 'c316a11' installed by privileged account 'infinitetechadmin'" loading="lazy" decoding="async" /><figcaption>Figure 4 — Windows Event log showing malicious service 'c316a11' installed by privileged account 'infinitetechadmin'</figcaption></figure>
<h2>4. Password Spray Attack Detection &amp; Analysis</h2>
<h3>4.1 Azure AD Failed Authentication Volume</h3>
<p>Following the on-premises service installation, the attacker pivoted to Azure AD and launched a password spray attack. A total of 63 failed authentication attempts were recorded in the Azure sign-in logs after the service installation event.</p>
<figure><img src="/assets/writeups/soc-apt29/fig05-password-spray-63.webp" alt="Figure 5 — Azure AD sign-in logs showing 63 failed authentication attempts during password spray" loading="lazy" decoding="async" /><figcaption>Figure 5 — Azure AD sign-in logs showing 63 failed authentication attempts during password spray</figcaption></figure>
<h3>4.2 Account Lockouts</h3>
<p>The repeated failed login attempts triggered account lockout policies for two user accounts. These accounts were identified through the Azure AD audit logs.</p>
<ul><li>Locked out accounts: Sarah Miles, Alice Jones</li></ul>
<figure><img src="/assets/writeups/soc-apt29/fig06-account-lockouts.webp" alt="Figure 6 — Azure AD logs showing account lockout events for Sarah Miles and Alice Jones" loading="lazy" decoding="async" /><figcaption>Figure 6 — Azure AD logs showing account lockout events for Sarah Miles and Alice Jones</figcaption></figure>
<h3>4.3 Initial Successful Compromise</h3>
<p>The password spray attack ultimately succeeded in compromising one user account.</p>

<h2>7. Establishing Automated Persistence</h2>
<h3>7.1 Azure Automation Account Abuse</h3>
<p>To establish long-term automated persistence, the attacker identified and repurposed an existing Azure Automation Account. Using this resource avoided the need to create new infrastructure, reducing the likelihood of detection through resource creation alerts.</p>

<h2>11. Recommendations</h2>
<h3>Immediate Actions</h3>
<ul><li>Revoke all active sessions and tokens for Maya Wilson and Tom Clarkson</li><li>Disable and investigate the 'infinitetechadmin' account for further compromise</li><li>Remove 'UsersReminders' runbook and 'DailyUsersReminder' schedule from the DAILYCHECKER automation account</li><li>Block IP addresses 48.211.64.27 and 35.158.160.255 at the firewall/Conditional Access level</li><li>Rotate all secrets in CORP-KV-PROD, INFRA-BACKUP-KV, and FINANCE-KV-EU immediately</li><li>Remove tom.clarkson@infinitechsolutions.xyz as owner from application 9999-8888</li><li>Remove malicious service 'c316a11' from ITWS01 and re-image the machine</li></ul>
<h3>Short-Term Hardening</h3>
<ul><li>Enforce MFA across all Azure AD accounts, especially privileged accounts</li><li>Implement Conditional Access policies restricting non-interactive authentication from unknown IPs</li><li>Enable Azure AD Identity Protection smart lockout and risky sign-in policies</li><li>Audit and restrict Microsoft Graph API permissions — limit delta query access</li><li>Review all Azure Automation Account permissions and enable change tracking on runbooks</li><li>Implement Key Vault access policies with just-in-time (JIT) access requirements</li></ul>
<h3>Long-Term Controls</h3>
<ul><li>Deploy Microsoft Sentinel analytics rules for password spray detection with proper authenticationThreshold tuning</li><li>Implement a Zero Trust architecture for all Azure resource access</li><li>Conduct regular privileged access reviews for all Azure AD application owners</li><li>Establish a formal incident response playbook for Azure AD compromise scenarios</li><li>Implement User and Entity Behavior Analytics (UEBA) in Sentinel for anomaly detection</li></ul>

<script>
(function () {
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    let w, h, dpr, time = 0, scale = 36, originX = 0, originY = 0;
    let COLS = 20, ROWS = 20;

    // ── Full-screen isometric red cube grid (dark theme) ─────
    // Soft ambient cubes; hover/click still lift. Frozen when idle.
    const CELL = 1;
    const HALF = 0.40;
    const BASE_H = 0.28;
    const LIFT_MAX = 1.9;
    const HOVER_PX = 150;
    const FRAME_MS = 1000 / 30;
    const IDLE_MS = 1600;

    const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const saveData = !!(navigator.connection && navigator.connection.saveData);
    const coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
    const staticOnly = reduceMotion || saveData || (coarse && Math.min(window.innerWidth, window.innerHeight) < 700);

    let cubes = [];
    let waves = [];
    const mouse = { x: -9999, y: -9999, active: false };
    let running = false;
    let raf = 0;
    let lastFrame = 0;
    let idleTimer = 0;

    function seed() {
        cubes = [];
        const ox = (COLS - 1) * CELL * 0.5;
        const oz = (ROWS - 1) * CELL * 0.5;
        for (let j = 0; j < ROWS; j++) {
            for (let i = 0; i < COLS; i++) {
                const x = i * CELL - ox;
                const z = j * CELL - oz;
                cubes.push({
                    i, j, x, z,
                    h: BASE_H,
                    vh: 0,
                    phase: (i * 0.35 + j * 0.41),
                    sx: 0, sy: 0,
                    depth: x + z,
                });
            }
        }
        cubes.sort((a, b) => a.depth - b.depth);
    }

    function project(x, y, z) {
        return {
            x: originX + (x - z) * scale * 0.866,
            y: originY + (x + z) * scale * 0.5 - y * scale,
        };
    }

    function face(pts) {
        ctx.beginPath();
        ctx.moveTo(pts[0].x, pts[0].y);
        ctx.lineTo(pts[1].x, pts[1].y);
        ctx.lineTo(pts[2].x, pts[2].y);
        ctx.lineTo(pts[3].x, pts[3].y);
        ctx.closePath();
    }

    function drawCube(cx, cz, height, brightness, stroke) {
        const top = height;
        const c1 = project(cx + HALF, 0,   cz - HALF);
        const c2 = project(cx + HALF, 0,   cz + HALF);
        const c3 = project(cx - HALF, 0,   cz + HALF);
        const t0 = project(cx - HALF, top, cz - HALF);
        const t1 = project(cx + HALF, top, cz - HALF);
        const t2 = project(cx + HALF, top, cz + HALF);
        const t3 = project(cx - HALF, top, cz + HALF);

        const b = brightness < 0 ? 0 : brightness > 1 ? 1 : brightness;
        if (stroke) {
            ctx.strokeStyle = `rgba(255, 100, 80, ${0.26 + b * 0.48})`;
            ctx.lineWidth = 0.6;
        }
        ctx.fillStyle = `rgba(130, 18, 18, ${0.11 + b * 0.28})`;
        face([c1, c2, t2, t1]);
        ctx.fill();
        if (stroke) ctx.stroke();
        ctx.fillStyle = `rgba(200, 32, 32, ${0.15 + b * 0.34})`;
        face([c3, c2, t2, t3]);
        ctx.fill();
        if (stroke) ctx.stroke();
        ctx.fillStyle = `rgba(255, 55, 55, ${0.22 + b * 0.44})`;
        face([t0, t1, t2, t3]);
        ctx.fill();
        if (stroke) ctx.stroke();
    }

    function spawnWave(clientX, clientY) {
        if (staticOnly) return;
        let best = null, bestD = Infinity;
        for (let k = 0; k < cubes.length; k++) {
            const c = cubes[k];
            const dx = c.sx - clientX, dy = c.sy - clientY;
            const d = dx * dx + dy * dy;
            if (d < bestD) { bestD = d; best = c; }
        }
        if (!best) return;
        waves.push({ x: best.x, z: best.z, r: 0, speed: 0.26, amp: 1.6, life: 1 });
        best.vh += 0.65;
        kick();
    }

    function poke(x, y) {
        mouse.x = x; mouse.y = y; mouse.active = true;
        kick();
    }

    function kick() {
        if (staticOnly) return;
        clearTimeout(idleTimer);
        idleTimer = setTimeout(() => {
            mouse.active = false;
            if (!waves.length) stop();
        }, IDLE_MS);
        if (!running && document.visibilityState !== 'hidden') start();
    }

    function start() {
        if (running || staticOnly) return;
        running = true;
        lastFrame = 0;
        raf = requestAnimationFrame(step);
    }

    function stop() {
        running = false;
        if (raf) cancelAnimationFrame(raf);
        raf = 0;
    }

    window.addEventListener('mousemove', e => poke(e.clientX, e.clientY), { passive: true });
    window.addEventListener('mouseleave', () => { mouse.active = false; });
    window.addEventListener('touchmove', e => {
        if (e.touches[0]) poke(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });
    window.addEventListener('click', e => spawnWave(e.clientX, e.clientY));
    window.addEventListener('touchstart', e => {
        if (e.touches[0]) spawnWave(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });
    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden') stop();
    });

    function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, staticOnly ? 1 : 1.25);
        w = window.innerWidth;
        h = window.innerHeight;
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.imageSmoothingEnabled = false;

        // Cube size that tiles nicely; expand the grid until the isometric
        // diamond covers the full viewport (diamond ≠ AABB).
        scale = Math.max(18, Math.min(w, h) / 26);
        originX = w * 0.5;
        originY = h * 0.45;
        const halfW = w * 0.5 + 100;
        const halfH = Math.max(originY, h - originY) + 100;
        const nFromDiamond = Math.ceil(halfW / (scale * 0.866) + halfH / (scale * 0.5));
        // Cover the whole screen; idle-freeze + 30fps keep this cheap.
        COLS = Math.min(staticOnly ? 36 : 56, Math.max(30, nFromDiamond));
        ROWS = COLS;
        seed();
        paint(true);
    }

    function paint(forceStatic) {
        ctx.fillStyle = '#0a0a0a';
        ctx.fillRect(0, 0, w, h);

        const glow = ctx.createRadialGradient(originX, originY * 0.85, 0, originX, originY, Math.max(w, h) * 0.72);
        glow.addColorStop(0, 'rgba(160, 18, 18, 0.08)');
        glow.addColorStop(0.5, 'rgba(60, 8, 8, 0.04)');
        glow.addColorStop(1, 'rgba(10, 10, 10, 0)');
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, w, h);

        const animate = !forceStatic && !staticOnly;
        if (animate) {
            waves = waves.filter(wv => wv.life > 0.02 && wv.r < COLS);
            for (let wi = 0; wi < waves.length; wi++) {
                const wv = waves[wi];
                wv.r += wv.speed;
                wv.life *= 0.987;
                wv.amp *= 0.99;
            }
        }

        for (let k = 0; k < cubes.length; k++) {
            const c = cubes[k];
            if (animate) {
                const breathe = Math.sin(time * 1.15 + c.phase) * 0.05;
                let target = BASE_H + breathe;
                if (mouse.active) {
                    const dx = c.sx - mouse.x, dy = c.sy - mouse.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < HOVER_PX) {
                        const t = 1 - dist / HOVER_PX;
                        target += LIFT_MAX * t * t;
                    }
                }
                for (let wi = 0; wi < waves.length; wi++) {
                    const wv = waves[wi];
                    const dx = c.x - wv.x, dz = c.z - wv.z;
                    const d = Math.sqrt(dx * dx + dz * dz);
                    const band = Math.abs(d - wv.r);
                    if (band < 1.4) target += (1 - band / 1.4) * wv.amp * wv.life;
                }
                const force = (target - c.h) * 0.16;
                c.vh = (c.vh + force) * 0.78;
                c.h += c.vh;
                if (c.h < 0.1) { c.h = 0.1; c.vh *= 0.5; }
            }
            const p = project(c.x, c.h, c.z);
            c.sx = p.x; c.sy = p.y;
        }

        for (let k = 0; k < cubes.length; k++) {
            const c = cubes[k];
            if (c.sx < -80 || c.sx > w + 80 || c.sy < -80 || c.sy > h + 80) continue;
            const lift = Math.max(0, Math.min(1, (c.h - BASE_H) / LIFT_MAX));
            const brightness = 0.28 + lift * 0.62 + (animate ? Math.sin(time * 1.1 + c.phase) * 0.03 : 0);
            drawCube(c.x, c.z, c.h, brightness, lift > 0.08);
        }
    }

    function step(now) {
        if (!running) return;
        raf = requestAnimationFrame(step);
        if (now - lastFrame < FRAME_MS) return;
        lastFrame = now;
        time += 0.033;
        paint(false);
        if (!mouse.active && !waves.length) stop();
    }

    let resizeTimer = 0;
    window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(resize, 120);
    });
    resize();
})();
</script>
