  <h1>Malicious MCP Integration to AWS Cryptomining</h1>
  <p>Jul 2026</p>
  <p>High-confidence reconstruction of a fraudulent Cursor MCP server leading to endpoint execution, AWS admin credential theft, 16 GPU instances, and XMRig cryptomining.</p>
  <h2>Executive Summary</h2>
<p>A backend developer searching for a Cursor Model Context Protocol (MCP) integration visited the fraudulent site awesomeawsmcp.com and installed an MCP server named “AWS dev ops.” Its configuration invoked cmd.exe to download and execute s.exe from 3.72.63.40. The payload established command-and-control, staged the workstation’s AWS credential directory, and enabled theft of the privileged admin IAM user in account 990227772331.</p>
<p>The actor then launched 16 p3.2xlarge EC2 instances across four AWS regions and deployed an XMRig RandomX miner through unMineable. The configured Solana payout wallet was publicly labeled “Drift Exploiter 1” and received 45,292.208963921 dSOL from Drift Vault.</p>

<h2>Attack Timeline</h2>
<table><thead><tr><th>UTC time</th><th>Finding</th></tr></thead><tbody><tr><td>2026-04-20 20:57</td><td>Victim visited http://awesomeawsmcp.com/.</td></tr><tr><td>Shortly after</td><td>Cursor MCP server “AWS dev ops” installed with embedded curl command.</td></tr><tr><td>20:58:11</td><td>curl.exe downloaded s.exe from 3.72.63.40.</td></tr><tr><td>20:58:42</td><td>Payload executed; first observed C2 command was pwd.</td></tr><tr><td>21:03:07</td><td>C:\Users\Administrator\.aws copied to hidden .exfil staging directory.</td></tr><tr><td>2026-04-21 10:15 onward</td><td>Stolen admin credentials used from 3.72.63.40.</td></tr><tr><td>10:15–11:00+</td><td>16 p3.2xlarge instances launched across four regions.</td></tr><tr><td>Post-launch</td><td>XMRig configured for rx.unmineable.com:3333 and attacker Solana wallet.</td></tr></tbody></table>
<h2>Initial Access &amp; Execution</h2>
<p>Chromium history recorded a single typed visit to awesomeawsmcp.com titled “AWS dev ops.” The raw Chromium timestamp 13421192228031344 converts to 2026-04-20 20:57:08.031344Z. Cursor’s mcp.json defined the server as cmd.exe /c with a download-and-run chain targeting http://3.72.63.40:80/payload/s.exe.</p>

<figure><img src="/assets/writeups/cursorjack/fig02-chromium-timestamp.webp" alt="Figure 2 — DCode conversion of the Chromium timestamp to 20 April 2026 at 20:57 UTC." loading="lazy" decoding="async" /><figcaption>Figure 2 — DCode conversion of the Chromium timestamp to 20 April 2026 at 20:57 UTC.</figcaption></figure>

<h2>Blockchain Attribution &amp; Limitations</h2>
<p>Solscan labeled the payout wallet “Drift Exploiter 1” and showed an incoming transfer of 45,292.208963921 dSOL from Drift Vault, with a displayed historical value of $4,466,805.96. The exact wallet match provides strong infrastructure-level correlation, but public blockchain labels and search results are corroborating intelligence rather than sole proof of identity.</p>

<h2>Root Cause</h2>
<ul><li>Untrusted MCP integration installed without publisher or repository validation</li><li>Cursor allowed arbitrary shell execution from MCP configuration</li><li>Long-lived AWS credentials stored locally on the developer workstation</li><li>Admin IAM permissions allowed expensive multi-region GPU deployment</li><li>No SCP, quota, budget alarm, or regional restriction stopped the abuse</li></ul>
<h2>Containment &amp; Hardening</h2>
<ul><li>Preserve and isolate the workstation before removing the MCP configuration or payload</li><li>Disable the compromised admin user, revoke keys and sessions, and rotate all accessible secrets</li><li>Terminate unauthorized EC2 resources and inspect related cloud artifacts in every region</li><li>Block awesomeawsmcp.com, 3.72.63.40, the payload URL, and rx.unmineable.com:3333</li><li>Allow-list MCP servers; detect IDE-to-shell-to-temporary-binary execution chains</li><li>Use short-lived MFA-protected AWS roles, SCPs, region and instance-family restrictions, budgets, and anomaly alerts</li></ul>
<h2>Conclusion</h2>
<p>The supplied endpoint, Cursor, CloudTrail, mining-script, and blockchain artifacts support a high-confidence conclusion that a fraudulent MCP integration enabled endpoint code execution, privileged AWS credential theft, unauthorized GPU deployment, and cryptomining. The report is based on supplied lab artifacts; time-sensitive public labels and token values should be preserved with timestamps outside a training context.</p>

<script>
(function () {
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true })
        || canvas.getContext('2d', { alpha: false });
    let w, h, dpr, time = 0, scale = 36, originX = 0, originY = 0;
    let COLS = 20, ROWS = 20;

    // ── Full-screen isometric red cube grid (dark theme) ─────
    // Smaller scale = farther camera. Count rises to still cover corners,
    // then clamps so a 4K screen cannot spawn thousands of cubes.
    const CELL = 1;
    const HALF = 0.36;
    const BASE_H = 0.16;
    const LIFT_MAX = 1.35;
    const TARGET_SCALE = 30;
    const HOVER_PX = 150;
    const HOVER_PX2 = HOVER_PX * HOVER_PX;
    const FRAME_MS = 1000 / 30;
    const IDLE_BREATH_MS = 1000 / 12;
    const IDLE_MS = 400;
    const COVER_PAD = 120;
    const AXIS_MIN = 22;
    const AXIS_MAX = 48;
    const AXIS_STATIC_MIN = 14;
    const AXIS_STATIC_MAX = 24;

    const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const saveData = !!(navigator.connection && navigator.connection.saveData);
    const coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
    const lowMem = typeof navigator.deviceMemory === 'number' && navigator.deviceMemory > 0 && navigator.deviceMemory <= 2;
    const lowCpu = typeof navigator.hardwareConcurrency === 'number' && navigator.hardwareConcurrency > 0 && navigator.hardwareConcurrency <= 2;
    const staticOnly = reduceMotion || saveData || lowMem || lowCpu
        || (coarse && Math.min(window.innerWidth, window.innerHeight) < 700);

    let cubes = [];
    let waves = [];
    let breathers = [];
    const mouse = { x: -9999, y: -9999, active: false };
    let running = false;
    let raf = 0;
    let lastFrame = 0;
    let idleTimer = 0;
    let contentRect = null;

    function viewportSize() {
        const vv = window.visualViewport;
        return {
            w: Math.max(window.innerWidth, vv ? Math.round(vv.width) : 0),
            h: Math.max(window.innerHeight, vv ? Math.round(vv.height) : 0),
        };
    }

    function seed() {
        cubes = [];
        const ox = (COLS - 1) * CELL * 0.5;
        const oz = (ROWS - 1) * CELL * 0.5;
        for (let j = 0; j < ROWS; j++) {
            for (let i = 0; i < COLS; i++) {
                const x = i * CELL - ox;
                const z = j * CELL - oz;
                cubes.push({
                    i, j, x, z,
                    h: BASE_H,
                    vh: 0,
                    phase: (i * 0.35 + j * 0.41),
                    sx: 0, sy: 0,
                    breathe: false,
                    depth: x + z,
                });
            }
        }
        cubes.sort((a, b) => a.depth - b.depth);
    }

    function project(x, y, z) {
        return {
            x: originX + (x - z) * scale * 0.866,
            y: originY + (x + z) * scale * 0.5 - y * scale,
        };
    }

    function face(pts) {
        ctx.beginPath();
        ctx.moveTo(pts[0].x, pts[0].y);
        ctx.lineTo(pts[1].x, pts[1].y);
        ctx.lineTo(pts[2].x, pts[2].y);
        ctx.lineTo(pts[3].x, pts[3].y);
        ctx.closePath();
    }

    function drawCube(cx, cz, height, brightness, stroke) {
        const top = height;
        const c1 = project(cx + HALF, 0,   cz - HALF);
        const c2 = project(cx + HALF, 0,   cz + HALF);
        const c3 = project(cx - HALF, 0,   cz + HALF);
        const t0 = project(cx - HALF, top, cz - HALF);
        const t1 = project(cx + HALF, top, cz - HALF);
        const t2 = project(cx + HALF, top, cz + HALF);
        const t3 = project(cx - HALF, top, cz + HALF);

        const b = brightness < 0 ? 0 : brightness > 1 ? 1 : brightness;
        if (stroke) {
            ctx.strokeStyle = `rgba(255, 100, 80, ${0.26 + b * 0.48})`;
            ctx.lineWidth = 0.6;
        }
        ctx.fillStyle = `rgba(130, 18, 18, ${0.07 + b * 0.18})`;
        face([c1, c2, t2, t1]);
        ctx.fill();
        if (stroke) ctx.stroke();
        ctx.fillStyle = `rgba(200, 32, 32, ${0.10 + b * 0.22})`;
        face([c3, c2, t2, t3]);
        ctx.fill();
        if (stroke) ctx.stroke();
        ctx.fillStyle = `rgba(255, 55, 55, ${0.14 + b * 0.28})`;
        face([t0, t1, t2, t3]);
        ctx.fill();
        if (stroke) ctx.stroke();
    }

    function refreshContentRect() {
        const main = document.getElementById('main');
        if (!main) {
            contentRect = null;
            return;
        }
        const r = main.getBoundingClientRect();
        if (r.width < 8 || r.height < 8) {
            contentRect = null;
            return;
        }
        contentRect = {
            l: r.left,
            r: r.right,
            t: r.top,
            b: r.bottom,
        };
    }

    function underContent(sx, sy) {
        const box = contentRect;
        return !!(box && sx > box.l && sx < box.r && sy > box.t && sy < box.b);
    }

    function spawnWave(clientX, clientY) {
        if (staticOnly) return;
        refreshContentRect();
        let best = null, bestD = Infinity;
        for (let k = 0; k < cubes.length; k++) {
            const c = cubes[k];
            if (underContent(c.sx, c.sy)) continue;
            const dx = c.sx - clientX, dy = c.sy - clientY;
            const d = dx * dx + dy * dy;
            if (d < bestD) { bestD = d; best = c; }
        }
        if (!best) return;
        waves.push({ x: best.x, z: best.z, r: 0, speed: 0.26, amp: 1.6, life: 1 });
        best.vh += 0.65;
        kick();
    }

    function poke(x, y) {
        mouse.x = x; mouse.y = y; mouse.active = true;
        kick();
    }

    function kick() {
        if (staticOnly) return;
        clearTimeout(idleTimer);
        idleTimer = setTimeout(() => { mouse.active = false; }, IDLE_MS);
        if (!running && document.visibilityState !== 'hidden') start();
    }

    function start() {
        if (running || staticOnly) return;
        running = true;
        lastFrame = 0;
        raf = requestAnimationFrame(step);
    }

    function stop() {
        running = false;
        if (raf) cancelAnimationFrame(raf);
        raf = 0;
    }

    window.addEventListener('mousemove', e => poke(e.clientX, e.clientY), { passive: true });
    window.addEventListener('mouseleave', () => { mouse.active = false; });
    window.addEventListener('touchmove', e => {
        if (e.touches[0]) poke(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });
    window.addEventListener('click', e => spawnWave(e.clientX, e.clientY));
    window.addEventListener('touchstart', e => {
        if (e.touches[0]) spawnWave(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });
    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden') stop();
        else if (!staticOnly) start();
    });

    // Tiny parallax: the painted field drifts a few pixels with scroll.
    // CSS transform only — no cube repaint. Clamped so long pages do not
    // walk the canvas off-screen.
    let scrollTick = 0;
    function applyParallax() {
        scrollTick = 0;
        if (staticOnly || reduceMotion) {
            canvas.style.transform = '';
            return;
        }
        const y = Math.max(-8, Math.min(8, -window.scrollY * 0.03));
        canvas.style.transform = y ? 'translate3d(0,' + y.toFixed(1) + 'px,0)' : '';
    }
    window.addEventListener('scroll', () => {
        if (scrollTick) return;
        scrollTick = requestAnimationFrame(applyParallax);
    }, { passive: true });

    function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, staticOnly ? 1 : 1.25);
        const vp = viewportSize();
        w = vp.w;
        h = vp.h;
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.imageSmoothingEnabled = false;

        originX = w * 0.5;
        originY = h * 0.52;
        const halfW = w * 0.5 + COVER_PAD;
        const halfH = Math.max(originY, h - originY) + COVER_PAD;
        const coverSpan = halfW / 0.866 + halfH / 0.5;

        const axisMin = staticOnly ? AXIS_STATIC_MIN : AXIS_MIN;
        const axisMax = staticOnly ? AXIS_STATIC_MAX : AXIS_MAX;
        const farScale = staticOnly ? TARGET_SCALE + 4 : TARGET_SCALE;
        const needed = Math.ceil(coverSpan / farScale) + 1;
        COLS = Math.max(axisMin, Math.min(axisMax, needed));
        ROWS = COLS;
        scale = Math.max(farScale, coverSpan / (COLS - 1));

        seed();
        pickBreathers();
        paint(true);
        applyParallax();
        if (!staticOnly) start();
    }

    function pickBreathers() {
        breathers = [];
        if (staticOnly) return;
        const edge = [];
        for (let k = 0; k < cubes.length; k++) {
            const c = cubes[k];
            c.breathe = false;
            const p = project(c.x, BASE_H, c.z);
            c.sx = p.x; c.sy = p.y;
            if (c.sx < 8 || c.sx > w - 8 || c.sy < 8 || c.sy > h - 8) continue;
            if (c.sx < 220 || c.sx > w - 220 || c.sy < 100 || c.sy > h - 120) edge.push(c);
        }
        const max = 10;
        const stride = Math.max(1, Math.ceil(edge.length / Math.max(max, 1)));
        for (let i = 0; i < edge.length && breathers.length < max; i += stride) {
            edge[i].breathe = true;
            breathers.push(edge[i]);
        }
    }

    function paint(forceStatic) {
        ctx.fillStyle = '#0a0a0a';
        ctx.fillRect(0, 0, w, h);

        const glow = ctx.createRadialGradient(originX, originY * 0.85, 0, originX, originY, Math.max(w, h) * 0.72);
        glow.addColorStop(0, 'rgba(160, 18, 18, 0.08)');
        glow.addColorStop(0.5, 'rgba(60, 8, 8, 0.04)');
        glow.addColorStop(1, 'rgba(10, 10, 10, 0)');
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, w, h);

        refreshContentRect();

        const animate = !forceStatic && !staticOnly;
        if (animate) {
            waves = waves.filter(wv => wv.life > 0.02 && wv.r < COLS);
            for (let wi = 0; wi < waves.length; wi++) {
                const wv = waves[wi];
                wv.r += wv.speed;
                wv.life *= 0.987;
                wv.amp *= 0.99;
            }
        }

        let anyMotion = waves.length > 0;

        for (let k = 0; k < cubes.length; k++) {
            const c = cubes[k];
            if (animate) {
                const hidden = underContent(c.sx, c.sy);
                const dx = c.sx - mouse.x, dy = c.sy - mouse.y;
                const nearMouse = !hidden && mouse.active && (dx * dx + dy * dy) < HOVER_PX2;
                const unsettled = Math.abs(c.h - BASE_H) > 0.003 || Math.abs(c.vh) > 0.003;
                let nearWave = false;
                if (waves.length) {
                    for (let wi = 0; wi < waves.length; wi++) {
                        const wv = waves[wi];
                        const ddx = c.x - wv.x, ddz = c.z - wv.z;
                        const d = Math.sqrt(ddx * ddx + ddz * ddz);
                        if (Math.abs(d - wv.r) < 1.6) { nearWave = true; break; }
                    }
                }
                if (nearMouse || nearWave || unsettled || c.breathe) {
                    anyMotion = true;
                    const breathe = nearMouse
                        ? Math.sin(time * 1.15 + c.phase) * 0.05
                        : (c.breathe ? Math.sin(time * 0.7 + c.phase) * 0.16 : 0);
                    let target = BASE_H + breathe;
                    if (nearMouse) {
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        const t = 1 - dist / HOVER_PX;
                        target += LIFT_MAX * t * t;
                    }
                    for (let wi = 0; wi < waves.length; wi++) {
                        const wv = waves[wi];
                        const ddx = c.x - wv.x, ddz = c.z - wv.z;
                        const d = Math.sqrt(ddx * ddx + ddz * ddz);
                        const band = Math.abs(d - wv.r);
                        if (band < 1.4) target += (1 - band / 1.4) * wv.amp * wv.life;
                    }
                    const force = (target - c.h) * 0.16;
                    c.vh = (c.vh + force) * 0.78;
                    c.h += c.vh;
                    if (c.h < 0.1) { c.h = 0.1; c.vh *= 0.5; }
                } else if (c.h !== BASE_H) {
                    c.h = BASE_H;
                    c.vh = 0;
                }
            }
            const p = project(c.x, c.h, c.z);
            c.sx = p.x; c.sy = p.y;
        }

        for (let k = 0; k < cubes.length; k++) {
            const c = cubes[k];
            if (c.sx < -80 || c.sx > w + 80 || c.sy < -80 || c.sy > h + 80) continue;
            const lift = Math.max(0, Math.min(1, (c.h - BASE_H) / LIFT_MAX));
            const brightness = 0.18 + lift * 0.55 + (animate && lift > 0.01 ? Math.sin(time * 1.1 + c.phase) * 0.03 : 0);
            drawCube(c.x, c.z, c.h, brightness, lift > 0.08);
        }

        return anyMotion;
    }

    function step(now) {
        if (!running) return;
        raf = requestAnimationFrame(step);
        const busy = mouse.active || waves.length > 0;
        const interval = busy ? FRAME_MS : IDLE_BREATH_MS;
        if (now - lastFrame < interval) return;
        const dt = Math.min(0.05, (now - lastFrame) / 1000);
        lastFrame = now;
        time += dt;
        if (!paint(false) && !breathers.length) stop();
    }

    let resizeTimer = 0;
    const onResize = () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(resize, 120);
    };
    window.addEventListener('resize', onResize);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', onResize);
    resize();
})();
