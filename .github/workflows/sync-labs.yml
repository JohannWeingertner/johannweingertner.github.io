name: Sync CyberDefenders labs

on:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: node scripts/sync-labs.mjs
        env:
          CD_USERNAME: Afterguard
      - run: npm run build
      - name: Commit if labs changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/labs.js index.html assets/app.js 404.html certifications projects writeup feed.xml feed/index.html certs
          git diff --cached --quiet && echo "No lab changes" && exit 0
          git commit -m "chore: sync CyberDefenders labs"
          git push
